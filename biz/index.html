                "ENFP": [{ type: "열정 만수르", like: "새로운 프로젝트 제안, '할 수 있다'는 긍정 에너지, 브레인스토밍, 칭찬", dislike: "반복적인 단순 업무, 디테일 지적질, 통제와 감시, 무관심", tip: "상사의 아이디어가 좀 뜬구름 잡는 소리여도 일단 '재밌겠는데요?'라고 맞장구치세요." }],
                "ENTP": [{ type: "혁신적인 발명가", like: "기존 방식을 뒤집는 아이디어, 논리적인 반박과 토론, 스마트함", dislike: "무조건적인 복종, '원래 그랬습니다'라는 답변, 지루함, 꽉 막힘", tip: "상사의 말에 무조건 '네' 하기보다 '이런 관점도 있지 않을까요?'라고 건설적인 의견을 내세요." }],
                "ESTJ": [{ type: "전형적인 관리자형", like: "체계적인 보고, 근태 완벽 준수, 확실한 성과 지표, 충성심, 스피드", dislike: "변명, 일정 지연, 양식 무시, 위계질서 위반, 우유부단함", tip: "가장 다루기 쉽습니다. 시키는 대로, 정해진 시간에, 정해진 양식으로 가져가면 됩니다. 토 달지 마세요." }],
                "ESFJ": [{ type: "친목 도모형 리더", like: "가족 같은 분위기, 경조사 챙기기, 활발한 소통, 예의 바름", dislike: "개인플레이, 팀 분위기 망치는 행동, 인사 안 하는 것, 무심함", tip: "커피 한 잔 타 드리면서 '주말 잘 보내셨어요?'라고 먼저 말 거세요. 관계가 곧 업무 능력입니다." }],
                "ENFJ": [{ type: "열혈 코치님", like: "성장하려는 의지, 팀워크, 긍정적인 영향력, 적극성", dislike: "이기적인 행동, 팀 화합 저해, 부정적인 언어 사용, 소극적 태도", tip: "당신의 롤모델이 상사라고 말하세요. '팀장님처럼 되고 싶습니다'라는 말에 모든 지원을 아끼지 않을 겁니다." }],
                "ENTJ": [{ type: "야망 있는 지휘관", like: "탁월한 성과, 알아서 선제적으로 처리하는 능력, 프로페셔널, 야망", dislike: "게으름, 멍청한 실수 반복, 감정적인 태도, 느린 속도", tip: "질문하러 갈 때 '제 생각은 이런데 컨펌 부탁드립니다'라고 본인의 안을 들고 가세요. 빈손으로 가면 혼납니다." }]
            };

            // 2. 궁합 점수 로직 (직장)
            function getWorkHarmony(me, you) {
                let score = 50;
                let title = "", desc = "", conflict = "";
                
                const sameSN = (me.includes('S') === you.includes('S'));
                const sameJP = (me.includes('J') === you.includes('J'));
                const sameTF = (me.includes('T') === you.includes('T'));

                // 업무 스타일 (J/P가 중요)
                if(sameJP) score += 20; else score -= 15;
                // 의사소통 (S/N이 중요)
                if(sameSN) score += 10; else score -= 5;
                // 평가 기준 (T/F)
                if(sameTF) score += 10; 

                score = Math.min(100, Math.max(10, score));

                if (score >= 80) { title = "🏆 환상의 복식조! 승진길 예약"; desc = "업무 스타일이 찰떡입니다. 말하지 않아도 통하는 사이! 이 상사 밑에 있으면 고속 승진 가능합니다."; }
                else if (score >= 60) { title = "🤝 무난한 비즈니스 파트너"; desc = "적당히 맞고 적당히 다릅니다. 서로의 선만 지키면 원만한 회사 생활이 가능합니다."; }
                else if (score >= 40) { title = "⚠️ 삐걱거리는 수레바퀴"; desc = "보고할 때마다 뭔가 어긋나는 느낌? 당신이 상사의 스타일을 파악하고 맞춰야 살아남습니다."; }
                else { title = "🌋 퇴사 유발자! 사표 품고 다님"; desc = "숨 쉬는 것조차 안 맞을 수 있습니다. 최대한 마주치지 않거나, 완벽하게 연기하며 버티세요."; }

                // 갈등 포인트
                if (!sameJP) {
                    if (you.includes('J')) conflict = "⚠️ <b>[주의]</b> 상사는 계획적이고 꼼꼼한데 당신이 즉흥적이라면 '무계획, 무능력'으로 찍힐 수 있습니다. 마감 기한 엄수가 생명입니다.";
                    else conflict = "⚠️ <b>[주의]</b> 상사는 융통성을 원하는데 당신이 너무 원칙만 따지면 '꽉 막혔다'고 답답해할 수 있습니다. 유연하게 대처하세요.";
                } else if (!sameSN) {
                    if (you.includes('S')) conflict = "⚠️ <b>[주의]</b> 상사는 구체적인 데이터와 팩트를 원합니다. 뜬구름 잡는 추상적인 이야기나 비전 제시는 씨알도 안 먹힙니다.";
                    else conflict = "⚠️ <b>[주의]</b> 상사는 큰 그림(Big Picture)을 보는데 당신이 너무 디테일에만 집착하면 '시야가 좁다'고 평가받을 수 있습니다.";
                } else {
                    conflict = "✨ <b>[평화]</b> 업무 스타일이 비슷해서 큰 갈등은 없습니다. 다만, 너무 편해져서 '선'을 넘지 않도록 주의하세요.";
                }

                return { score, title, desc, conflict };
            }

            // 3. 시크릿 가이드 데이터 (직장)
            const secretData = {
                "S": { appeal: "📊 <b>데이터와 경험 위주의 보고:</b> '좋을 것 같아요' 대신 '전년 대비 15% 상승 예상됩니다'라고 구체적인 수치로 말하세요.", beware: "☁️ <b>근거 없는 아이디어:</b> '그냥 느낌이 좋아서요' 같은 말은 상사를 화나게 합니다." },
                "N": { appeal: "🚀 <b>비전과 의미 중심의 보고:</b> 이 일이 회사에 가져올 미래 가치와 의미를 강조하세요. 큰 그림을 먼저 보여주세요.", beware: "🐜 <b>지나친 디테일 집착:</b> 사소한 오타나 폰트 같은 걸로 시간 끌지 마세요. 핵심이 중요합니다." },
                "T": { appeal: "🧠 <b>두괄식 결론 + 해결책 제시:</b> 변명하지 말고 '결론은 이겁니다. 대안은 A와 B가 있습니다'라고 깔끔하게 보고하세요.", beware: "😭 <b>감정적 호소:</b> '너무 힘들어요', '열심히 했는데요' 같은 감성팔이는 무능력으로 보입니다." },
                "F": { appeal: "🥰 <b>공감과 쿠션어 사용:</b> '팀장님 의견대로 하니 좋았습니다', '바쁘시겠지만~' 같은 멘트를 섞어주세요. 관계가 중요합니다.", beware: "❄️ <b>딱딱한 단답형:</b> '넵', '알겠습니다'만 반복하면 '화났나?'라고 오해하거나 건방지다고 생각합니다." },
                "J": { role: "📅 프로 계획러 부하직원", good: "마감 1일 전 중간 보고", bad: "당일 연차/지각" },
                "P": { role: "💡 센스 있는 해결사", good: "돌발 상황 유연한 대처", bad: "융통성 없이 규정만 따지기" }
            };

            // 리스트 변환
            const formatList = (str) => {
                if (!str) return "";
                return `<ul class="style-list space-y-2">` +
                    str.split(',').map(item => `<li>${item.trim()}</li>`).join('') +
                    `</ul>`;
            };

            function validateAndShowResult(openCoupang = false) {
                const inputA = document.getElementById('mbti-a');
                const inputB = document.getElementById('mbti-b');
                const valA = inputA.value.toUpperCase().trim();
                const valB = inputB.value.toUpperCase().trim();
                if (!validMbtiList.includes(valA) || !validMbtiList.includes(valB)) { alert("정확한 MBTI 4글자를 입력해주세요!"); return; }
                if (openCoupang) {
                    window.open('https://link.coupang.com/a/ddddJ5', '_blank');
                    setTimeout(() => { showResult(valA, valB); }, 100);
                } else {
                    showResult(valA, valB);
                }
            }

            window.showResultDirect = function() {
                validateAndShowResult(false);
            };

            window.showResultWithCoupang = function() {
                validateAndShowResult(true);
            };

            function showResult(me, you) {
                const tData = mbtiData[you][Math.floor(Math.random() * mbtiData[you].length)];
                const harmony = getWorkHarmony(me, you);
                
                const snKey = you.includes('S') ? 'S' : 'N';
                const tfKey = you.includes('T') ? 'T' : 'F';
                const jpKey = you.includes('J') ? 'J' : 'P';
                
                const secretAppeal = secretData[snKey].appeal + "<br>" + secretData[tfKey].appeal;
                const secretBeware = secretData[snKey].beware + "<br>" + secretData[tfKey].beware;
                const secretRole = secretData[jpKey];

                const resultHTML = `
                    <div class="clean-card p-6 md:p-8 text-center relative overflow-hidden bg-white">
                        <h2 class="text-2xl font-extrabold text-slate-800 mb-2">
                            <span class="text-point">${you}</span> 상사는<br>"${tData.type}"
                        </h2>
                        <p class="text-sm text-slate-500 mb-6 font-medium">업무 성향 분석</p>
                        
                        <div class="space-y-4 text-left">
                            <div class="bg-indigo-50 p-5 rounded-xl border-l-4 border-indigo-500">
                                <p class="font-bold text-indigo-600 text-sm mb-3">👍 좋아하는 부하직원 (Like)</p>
                                <div class="text-slate-600 text-sm">${formatList(tData.like)}</div>
                            </div>
                            <div class="bg-slate-50 p-5 rounded-xl border-l-4 border-slate-400">
                                <p class="font-bold text-slate-500 text-sm mb-3">👎 싫어하는 부하직원 (Dislike)</p>
                                <div class="text-slate-600 text-sm">${formatList(tData.dislike)}</div>
                            </div>
                        </div>
                        <div class="mt-5 text-xs text-slate-400 word-keep break-keep leading-relaxed bg-white border border-slate-100 p-3 rounded-lg">
                            <span class="font-bold">💡 Tip:</span> ${tData.tip}
                        </div>
                    </div>

                    <div class="clean-card p-6 md:p-8 text-center bg-white">
                        <h3 class="font-bold text-slate-400 text-xs tracking-widest mb-2">WORK COMPATIBILITY</h3>
                        <div class="text-5xl font-black text-indigo-600 mb-2">${harmony.score}<span class="text-2xl text-slate-300">/100</span></div>
                        
                        <div class="w-full bg-slate-100 rounded-full h-3 mb-6 overflow-hidden">
                            <div class="bg-gradient-to-r from-indigo-300 to-indigo-600 h-3 rounded-full score-bar" style="width: 0%"></div>
                        </div>

                        <h4 class="text-lg font-bold text-slate-800 mb-1">${harmony.title}</h4>
                        <p class="text-sm text-slate-500 mb-4 leading-relaxed word-keep break-keep">${harmony.desc}</p>
                        
                        <div class="bg-slate-50 px-4 py-3 rounded-xl border border-slate-100 text-left text-sm text-slate-600 leading-snug word-keep break-keep">
                            ${harmony.conflict}
                        </div>
                    </div>

                    <div class="clean-card relative overflow-hidden bg-white" style="min-height: 450px;">
                        
                        <div class="p-6 md:p-8 h-full bg-white">
                            <div class="flex items-center justify-center gap-2 mb-8">
                                <span class="bg-slate-800 text-white text-xs font-bold px-3 py-1 rounded-full">PREMIUM</span>
                                <h4 class="font-bold text-slate-800 text-lg">상사 맞춤 공략집</h4>
                            </div>

                            <div class="space-y-6">
                                <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100 shadow-sm">
                                    <h5 class="font-bold text-indigo-600 text-sm mb-3 flex items-center">
                                        <i class="fas fa-check-circle mr-2"></i>보고 & 어필 포인트 (Do)
                                    </h5>
                                    <ul class="custom-list text-slate-700 text-sm leading-relaxed space-y-2">
                                        ${formatList(secretAppeal)}
                                    </ul>
                                </div>

                                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm">
                                    <h5 class="font-bold text-slate-600 text-sm mb-3 flex items-center">
                                        <i class="fas fa-ban mr-2"></i>절대 금지 (Beware)
                                    </h5>
                                    <ul class="style-list text-slate-700 text-sm leading-relaxed space-y-2">
                                        ${formatList(secretBeware)}
                                    </ul>
                                </div>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 text-center flex flex-col justify-center">
                                        <p class="text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Survival Role</p>
                                        <p class="text-lg font-black text-blue-600 break-keep">${secretRole.role}</p>
                                    </div>
                                    <div class="bg-white p-5 rounded-2xl border border-slate-200 text-center">
                                        <div class="text-xs text-blue-600 font-bold mb-2">🙆‍♂️ ${secretRole.good}</div>
                                        <div class="text-xs text-rose-500 font-bold">🙅‍♀️ ${secretRole.bad}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('result-content').innerHTML = resultHTML;
                document.getElementById('input-page').classList.add('hidden');
                document.getElementById('result-page').classList.remove('hidden');
                window.scrollTo(0, 0);

                setTimeout(() => {
                    const bar = document.querySelector('.score-bar');
                    if(bar) bar.style.width = harmony.score + '%';
                }, 300);
            }

            document.getElementById('back-btn').addEventListener('click', () => {
                document.getElementById('input-page').classList.remove('hidden');
                document.getElementById('result-page').classList.add('hidden');
                document.getElementById('mbti-a').value = '';
                document.getElementById('mbti-b').value = '';
            });
        });
        
        window.shareLink = function() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: '직장상사 공략 가이드',
                    text: '김대리, 이거 봤어? 우리 팀장님 완전 이 유형이야 ㅋㅋ',
                    url: currentUrl,
                });
            } else {
                const t = document.createElement("textarea");
                document.body.appendChild(t);
                t.value = currentUrl;
                t.select();
                document.execCommand('copy');
                document.body.removeChild(t);
                alert('링크가 복사되었습니다! 동기 단톡방에 공유하세요.');
            }
        }
    </script>
    
    <footer class="mt-12 pt-8 pb-6 border-t border-rose-200/30 text-center">
        <p class="text-xs text-slate-400">
            © 2026 재밌는웹페이지연구소. All rights reserved.
        </p>
    </footer>
</body>
</html>
