  <script>
    const LIKERT = [
      { label: "매우 그렇다", value:  3 },
      { label: "그렇다",     value:  2 },
      { label: "조금 그렇다", value:  1 },
      { label: "조금 아니다", value: -1 },
      { label: "아니다",     value: -2 },
      { label: "매우 아니다", value: -3 }
    ];

    const AXES = {
      EI: { left: "E", right: "I" },
      SN: { left: "S", right: "N" },
      TF: { left: "T", right: "F" },
      JP: { left: "J", right: "P" }
    };

    // reverse: true이면 "그렇다"가 right(오른쪽) 성향으로 점수 반영됨 (예: SN-서브는 N쪽이라 reverse)
    const QUESTIONS = [
      // E/I
      { id: "EI1", axis: "EI", isMain: true,  reverse: false,
        text: "처음 가는 놀이터에서, 아이가 먼저 다른 아이에게 다가가 같이 놀자고 시도하는 편이다.",
        hint: "예: 장난감을 보여주거나 말을 건다" },
      { id: "EI2", axis: "EI", isMain: false, reverse: false,
        text: "처음 보는 어른을 만나면, 아이가 말/표정/몸짓으로 먼저 반응하는 편이다.",
        hint: "예: 인사하거나 질문하는 편" },

      // S/N (3~4세는 상상놀이/용도대로 놀이로 구분)
      { id: "SN1", axis: "SN", isMain: true,  reverse: false,
        text: "장난감은 정해진 용도대로(차는 굴리고, 인형은 안고) 놀이하는 편이다.",
        hint: "예: 같은 방식으로 반복해서 노는 편" },
      { id: "SN2", axis: "SN", isMain: false, reverse: true,
        text: "장난감/물건을 다른 걸로 “이라고 하며” 바꿔서 상상놀이(역할/스토리)를 자주 한다.",
        hint: "예: 블록=케이크, 막대=마법봉" },

      // T/F (요청 반영: 메인은 '설명 수용', 서브는 '공정/규칙')
      { id: "TF1", axis: "TF", isMain: true,  reverse: false,
        text: "아이가 화났을 때 “왜 안 되는지/어떻게 하면 되는지”를 짧게 설명해주면, 비교적 빨리 진정되는 편이다.",
        hint: "반대로 설명을 들으면 더 예민해지거나 거부하면 F 쪽일 수 있어요." },
      { id: "TF2", axis: "TF", isMain: false, reverse: false,
        text: "같은 장난감을 두고 다툴 때, 아이가 “번갈아 하자/차례야/규칙이야”처럼 공평한 기준을 먼저 말하는 편이다.",
        hint: "예: “내 차례야!”, “약속했잖아!”" },

      // J/P (요청 반영: '오늘 뭐해?'를 메인, 정리-다음활동 수긍을 서브)
      { id: "JP1", axis: "JP", isMain: true,  reverse: false,
        text: "아이가 “오늘 뭐 해?”처럼 다음에 할 일을 자주 확인하는 편이다.",
        hint: "불안해서 묻는 경우는 제외하고, 평소 확인 습관 기준" },
      { id: "JP2", axis: "JP", isMain: false, reverse: false,
        text: "“놀던 거 정리하고 다음 거 하자”라고 하면, 아이가 비교적 잘 수긍하고 정리로 넘어가는 편이다.",
        hint: "반대로 “아직 더 할래!” 하며 버티거나, 정리 시작까지 시간이 오래 걸리는 편" }
    ];

    function renderQuestions() {
      const root = document.getElementById("questions");
      root.innerHTML = "";

      QUESTIONS.forEach((q, idx) => {
        const options = LIKERT.map((o, i) => {
          const oid = `${q.id}_${i}`;
          return `
            <div class="flex items-center justify-center">
              <label class="cursor-pointer inline-flex items-center justify-center select-none" title="${o.label}" aria-label="${o.label}">
                <input id="${oid}" type="radio" name="${q.id}" value="${o.value}" class="sr-only peer" />
                <span class="relative grid place-items-center w-6 h-6 md:w-7 md:h-7 rounded-full border-2 border-slate-300 bg-white transition-all
                             peer-hover:border-amber-400 peer-hover:bg-amber-50
                             peer-checked:border-amber-500 peer-checked:bg-amber-400
                             peer-focus:ring-2 peer-focus:ring-amber-200">
                  <i class="fas fa-check text-white text-[12px] md:text-[13px] opacity-0 transition-opacity peer-checked:opacity-100"></i>
                </span>
              </label>
            </div>
          `;
        }).join("");

        root.insertAdjacentHTML("beforeend", `
          <div class="p-4 rounded-2xl border border-slate-200 bg-white">
            <div class="flex items-center justify-between gap-3">
              <div class="text-xs font-black text-slate-500">질문 ${idx + 1}</div>
            </div>
            <div class="mt-1 text-base font-extrabold text-slate-800 leading-snug">${q.text}</div>
            <div class="text-xs text-slate-500 mt-1">${q.hint}</div>
            <div class="mt-4 flex items-center gap-3">
              <div class="text-[11px] font-black text-slate-700 whitespace-nowrap">매우 그렇다 ⭕️</div>
              <div class="flex-1 grid grid-cols-6 gap-2 md:gap-3">
                ${options}
              </div>
              <div class="text-[11px] font-black text-slate-700 whitespace-nowrap">매우 아니다 ❌</div>
            </div>
          </div>
        `);
      });
    }

    function getAnswerValue(qid) {
      const el = document.querySelector(`input[name="${qid}"]:checked`);
      if (!el) return null;
      return parseInt(el.value, 10);
    }

    function computeAxis(axisKey) {
      const axis = AXES[axisKey];
      const qs = QUESTIONS.filter(q => q.axis === axisKey);
      const mainQ = qs.find(q => q.isMain);
      const subQ = qs.find(q => !q.isMain);

      const mainRaw = getAnswerValue(mainQ.id);
      const subRaw = getAnswerValue(subQ.id);
      if (mainRaw === null || subRaw === null) return null;

      const mainScore = mainQ.reverse ? -mainRaw : mainRaw;
      const subScore  = subQ.reverse  ? -subRaw  : subRaw;
      const total = mainScore + subScore;

      let letter = "";
      if (total > 0) letter = axis.left;
      else if (total < 0) letter = axis.right;
      else letter = (mainScore > 0 ? axis.left : axis.right); // 동점이면 메인으로 결정

      return { axisKey, left: axis.left, right: axis.right, total, mainScore, subScore, letter };
    }

    function friendlyLabel(axisKey, letter) {
      const map = {
        EI: { E: "외향(E)", I: "내향(I)" },
        SN: { S: "감각(S)", N: "직관(N)" },
        TF: { T: "설명/기준(T)", F: "공감/마음(F)" },
        JP: { J: "계획/확인(J)", P: "유연/즉흥(P)" }
      };
      return map[axisKey]?.[letter] || letter;
    }

    function renderResult(result) {
      const type = result.EI.letter + result.SN.letter + result.TF.letter + result.JP.letter;

      const axisTitle = {
        EI: "에너지",
        SN: "놀이 스타일",
        TF: "갈등 풀기",
        JP: "리듬/전환"
      };

      const axisCards = ["EI","SN","TF","JP"].map(k => {
        const r = result[k];
        const picked = friendlyLabel(k, r.letter);
        const other = friendlyLabel(k, r.letter === r.left ? r.right : r.left);

        return `
          <div class="p-5 rounded-2xl bg-white border border-slate-200">
            <div class="flex items-center justify-between">
              <div class="font-black text-slate-800">${axisTitle[k] || ""}</div>
            </div>
            <div class="mt-2 text-lg font-extrabold text-slate-900">
              <span class="text-point">${picked}</span>
              <span class="text-slate-400 text-sm font-bold"> vs ${other}</span>
            </div>
          </div>
        `;
      }).join("");

      const tips = {
        E: "새로운 친구/놀이에 에너지를 얻는 편. ‘같이 하기’ 활동을 자주 넣어주면 좋아해요.",
        I: "낯선 환경에서 워밍업이 필요한 편. ‘관찰→참여’ 순서로 시간을 주세요.",
        S: "익숙한 방식/손에 잡히는 놀이가 편한 편. 반복 가능한 놀이(블록, 퍼즐)를 좋아할 수 있어요.",
        N: "상상/역할놀이가 재미있는 편. “이건 뭐로 변신할까?” 같은 질문이 잘 먹혀요.",
        T: "짧은 설명/기준을 들으면 정리되는 편. ‘왜 안 되는지 1문장’이 효과적이에요.",
        F: "기분/관계에 더 민감한 편. 갈등은 ‘마음 안정→행동 안내’ 순서가 좋아요.",
        J: "예고/확인이 있으면 편한 편. “이따 ○○하고 집 가자”처럼 미리 말해주면 좋아요.",
        P: "즉흥 변화도 잘 타는 편. 대신 정리/전환은 ‘선택지 2개’로 유도해보세요."
      };

      const typeTips = [type[0], type[1], type[2], type[3]].map(ch => `<li class="text-sm text-slate-700 leading-relaxed"><b>${ch}</b>: ${tips[ch] || ''}</li>`).join("");

      const typeDescriptions = {
        "ESTJ": "규칙과 순서를 좋아하고, 계획대로 하는 것을 편안해해요. 친구들과 놀 때도 '이렇게 하자'고 제안하는 리더 역할을 자주 맡아요.",
        "ESTP": "즉흥적이고 활동적인 놀이를 좋아해요. 새로운 장난감이나 놀이터에 가면 바로 뛰어들어 탐험하는 편이에요.",
        "ESFJ": "다른 아이들의 기분을 잘 살피고, 함께 놀 때 모두가 즐거운지 확인하는 편이에요. 배려심이 많아 친구들이 좋아해요.",
        "ESFP": "즐거운 분위기를 만들고, 웃고 떠드는 것을 좋아해요. 새로운 친구를 만나면 금방 친해지며 함께 놀고 싶어 해요.",
        "ENTJ": "목표를 세우고 그걸 이루려고 노력해요. 놀이에서도 '이렇게 하면 더 재밌을 거야'라고 계획을 세우는 편이에요.",
        "ENTP": "상상력이 풍부하고 '만약에~' 같은 질문을 자주 해요. 장난감을 새로운 용도로 바꿔서 놀거나 창의적인 놀이를 좋아해요.",
        "ENFJ": "친구들이 행복한지 신경 쓰고, 모두가 함께 즐겁게 놀 수 있도록 도와주는 편이에요. 배려심이 깊어요.",
        "ENFP": "활발하고 에너지가 넘쳐요. 새로운 놀이나 친구를 만나는 것을 좋아하며, 감정 표현이 풍부하고 즐거운 분위기를 만들어요.",
        "ISTJ": "익숙한 놀이와 규칙을 좋아해요. 같은 장난감을 반복해서 놀거나, 일상 루틴이 바뀌면 불편해하는 편이에요.",
        "ISTP": "혼자서 조용히 관찰하고 탐구하는 것을 좋아해요. 장난감을 분해하거나 작동 원리를 알아보는 데 관심이 많아요.",
        "ISFJ": "조용하지만 친구들을 잘 챙기고 배려하는 편이에요. 익숙한 환경에서 편안해하며, 규칙과 약속을 잘 지켜요.",
        "ISFP": "부드럽고 예술적인 놀이를 좋아해요. 그림 그리기나 음악 듣기 같은 활동을 즐기며, 강요받는 것을 싫어해요.",
        "INTJ": "혼자서 깊이 생각하고 관찰하는 것을 좋아해요. 복잡한 퍼즐이나 전략 게임 같은 놀이에 집중력이 뛰어나요.",
        "INTP": "호기심이 많고 '왜?'라는 질문을 자주 해요. 장난감의 원리나 새로운 아이디어에 관심이 많으며, 혼자 탐구하는 것을 좋아해요.",
        "INFJ": "친구들의 마음을 잘 이해하고, 깊이 있는 관계를 원해요. 상상력이 풍부하며, 혼자만의 시간도 필요로 해요.",
        "INFP": "상상력이 풍부하고 감성적이에요. 역할놀이나 이야기 만들기를 좋아하며, 자신만의 세계에 빠져있는 시간을 즐겨요."
      };

      const typeDescription = typeDescriptions[type] || "우리 아이만의 특별한 성향을 가지고 있어요. 각 지표별 결과를 참고해주세요.";

      document.getElementById("result-content").innerHTML = `
        <div class="clean-card p-6 md:p-8 text-center">
          <div class="text-xs font-black text-white bg-point inline-flex px-3 py-1 rounded-full mb-3">RESULT</div>
          <h2 class="text-2xl md:text-3xl font-black text-slate-900 leading-tight">
            우리 아이 성향 힌트: <span class="text-point">${type}</span>
          </h2>
        </div>

        <div class="clean-card p-6 md:p-8">
          <h3 class="font-black text-slate-900 mb-3"><i class="fas fa-star mr-2 text-amber-500"></i>${type} 유형 특징</h3>
          <p class="text-slate-700 leading-relaxed text-sm">${typeDescription}</p>
        </div>

        <div class="clean-card p-6 md:p-8">
          <h3 class="font-black text-slate-900 mb-4"><i class="fas fa-magnifying-glass mr-2 text-indigo-500"></i>지표별 결과</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${axisCards}
          </div>
        </div>

        <div class="clean-card p-6 md:p-8">
          <h3 class="font-black text-slate-900 mb-4"><i class="fas fa-seedling mr-2 text-green-500"></i>육아/놀이 팁(짧게)</h3>
          <ul class="list-disc pl-5 space-y-2">
            ${typeTips}
          </ul>
        </div>
      `;
    }

    function validateAllAnswered() {
      for (const q of QUESTIONS) {
        if (getAnswerValue(q.id) === null) return false;
      }
      return true;
    }

    function runTest(openCoupang) {
      if (!validateAllAnswered()) {
        alert("8문항 모두 답변해주세요!");
        return;
      }
      if (openCoupang) {
        window.open('https://link.coupang.com/a/ddddJ5', '_blank');
        setTimeout(() => showResult(), 100);
      } else {
        showResult();
      }
    }

    function showResult() {
      const res = {
        EI: computeAxis("EI"),
        SN: computeAxis("SN"),
        TF: computeAxis("TF"),
        JP: computeAxis("JP")
      };
      renderResult(res);
      document.getElementById("input-page").classList.add("hidden");
      document.getElementById("result-page").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function resetPage() {
      document.getElementById("input-page").classList.remove("hidden");
      document.getElementById("result-page").classList.add("hidden");
      document.querySelectorAll('input[type="radio"]').forEach(el => { el.checked = false; });
      window.scrollTo(0, 0);
    }

    function shareLink() {
      const currentUrl = window.location.href;
      const title = "미취학 우리아이 성향 테스트 · 8문항(재미로)";
      const text = "보호자 관찰 8문항으로 우리 아이 성향을 재미로 확인해보기 🧒";
      if (navigator.share) {
        navigator.share({ title, text, url: currentUrl });
      } else {
        const t = document.createElement("textarea");
        document.body.appendChild(t);
        t.value = currentUrl;
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        alert("링크 복사 완료!");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderQuestions();
    });
  </script>
</body>
</html>
