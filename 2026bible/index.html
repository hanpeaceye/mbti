        function findVerses(openCoupang = false) {
            const mbti = document.getElementById('mbti').value.toUpperCase().trim();

            if (!selectedGender || !mbti) {
                alert("성별과 MBTI를 모두 선택해주세요!");
                return;
            }

            if (!validMbtiList.includes(mbti)) {
                alert("정확한 MBTI 4글자를 입력해주세요! (예: ENFP)");
                return;
            }

            function displayResult() {
                const mbtiSpecificData = bibleData[mbti];
                if (!mbtiSpecificData) {
                    alert("데이터 로딩 중 오류가 발생했습니다.");
                    return;
                }

                // 성별에 따른 데이터 선택
                const genderData = mbtiSpecificData[selectedGender];

                showResult(mbti, selectedGender, genderData.like, genderData.dislike);
            }

            if (openCoupang) {
                window.open('https://link.coupang.com/a/ddddJ5', '_blank');
                setTimeout(() => { displayResult(); }, 100);
            } else {
                displayResult();
            }
        }

        function showResult(mbti, gender, likeVerses, dislikeVerses) {
            const genderText = { "male": "남성", "female": "여성" };

            let likeHTML = likeVerses.map((verse, index) => `
                <div class="verse-card verse-card-like p-5 rounded-2xl shadow-sm mb-3">
                    <div class="flex items-start gap-3">
                        <div class="verse-number text-2xl font-black flex-shrink-0 text-emerald-500">${index + 1}</div>
                        <div class="flex-1">
                            <p class="text-lg font-bold text-slate-800 mb-2 leading-snug word-keep break-keep">"${verse.text}"</p>
                            <p class="text-xs font-bold text-emerald-600 mb-2">${verse.reference}</p>
                            <p class="text-sm text-slate-500 leading-relaxed bg-white/50 p-2 rounded-lg">💡 ${verse.explanation}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            let dislikeHTML = dislikeVerses.map((verse, index) => `
                <div class="verse-card verse-card-dislike p-5 rounded-2xl shadow-sm mb-3">
                    <div class="flex items-start gap-3">
                        <div class="verse-number text-2xl font-black flex-shrink-0 text-rose-500">${index + 1}</div>
                        <div class="flex-1">
                            <p class="text-lg font-bold text-slate-800 mb-2 leading-snug word-keep break-keep">"${verse.text}"</p>
                            <p class="text-xs font-bold text-rose-500 mb-2">${verse.reference}</p>
                            <p class="text-sm text-slate-500 leading-relaxed bg-white/50 p-2 rounded-lg">🤔 ${verse.explanation}</p>
                        </div>
                    </div>
                </div>
            `).join('');

            const resultHTML = `
                <div class="clean-card p-6 md:p-8 bg-white mb-6 text-center">
                    <span class="inline-block bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full mb-3">ANALYSIS RESULT</span>
                    <h2 class="text-2xl font-extrabold text-slate-800 mb-2">
                        <span class="text-point">${mbti}</span> ${genderText[gender]}
                    </h2>
                    <p class="text-slate-500 text-sm word-keep">나에게 맞는 말씀 처방전</p>
                </div>

                <div class="clean-card p-6 md:p-8 bg-white mb-6">
                    <h3 class="text-lg font-bold text-emerald-600 mb-4 flex items-center gap-2">
                        <i class="fas fa-check-circle"></i> 뽑으면 맘에 들어할만한
                    </h3>
                    ${likeHTML}
                </div>

                <div class="clean-card p-6 md:p-8 bg-white">
                    <h3 class="text-lg font-bold text-rose-500 mb-4 flex items-center gap-2">
                        <i class="fas fa-sync-alt"></i> 넣고 다시 뽑고싶을만한
                    </h3>
                    ${dislikeHTML}
                </div>
            `;

            document.getElementById('result-content').innerHTML = resultHTML;
            document.getElementById('input-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function resetPage() {
            document.getElementById('input-page').classList.remove('hidden');
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('mbti').value = '';
            selectedGender = '';
            document.getElementById('gender-male').className = 'flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl p-4 text-center font-bold text-slate-600 transition-all hover:bg-indigo-50 hover:border-indigo-300';
            document.getElementById('gender-female').className = 'flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl p-4 text-center font-bold text-slate-600 transition-all hover:bg-indigo-50 hover:border-indigo-300';
            window.scrollTo(0, 0);
        }

        function shareLink() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'MBTI 성경 구절', text: '재미로 보는 나에게 맞는 하나님의 말씀! 너도 한번 해봐 📖', url: currentUrl });
            } else {
                const t = document.createElement("textarea"); 
                document.body.appendChild(t); 
                t.value = currentUrl; 
                t.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(t); 
                alert('링크 복사 완료!');
            }
        }
