        const testList = [

            { url: '/young-forty', icon: 'fa-sparkles', color: 'violet', title: '영포티 검사', desc: '나는 진짜 영포티일까?' },
            { url: '/helchang', icon: 'fa-dumbbell', color: 'amber', title: '헬창 판독기', desc: '나는 헬창일까? 득근하세요' }
        ];

    function getOtherTestsHtml(currentUrl) {
        return testList.filter(t => t.url !== currentUrl).map(test => `
            <button onclick="location.href='${test.url}'" class="bg-white/95 border border-${test.color}-100 p-4 rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-1 transition-all group flex flex-col items-center text-center w-full">
                <div class="w-10 h-10 bg-${test.color}-50 rounded-full flex items-center justify-center text-${test.color}-500 mb-2 group-hover:scale-110 transition-transform">
                    <i class="fas ${test.icon}"></i>
                </div>
                <h3 class="font-bold text-slate-700 text-sm">${test.title}</h3>
                <p class="text-[10px] text-slate-400 mt-1">${test.desc}</p>
            </button>
        `).join('');
    }
        function initTestGrids(currentUrl) {
            document.querySelectorAll('[data-test-grid]').forEach(grid => {
                grid.innerHTML = getOtherTestsHtml(currentUrl);
            });
        }


        // 질문 데이터 (10문제, 총 100점)
        // 난이도: 하(5점), 중(10점), 상(15점)
        const questions = [
            {
                text: "주식 시장에서 주가가 상승하는 추세를 뜻하는 동물은?",
                options: ["황소 (Bull)", "곰 (Bear)", "닭 (Chicken)", "돼지 (Pig)"],
                correct: 0,
                difficulty: "하",
                difficultyClass: "diff-low",
                score: 5
            },
            {
                text: "기업이 이익의 일부를 주주들에게 현금이나 주식으로 나눠주는 것은?",
                options: ["이자 (Interest)", "배당 (Dividend)", "증자 (Capital Increase)", "감자 (Capital Reduction)"],
                correct: 1,
                difficulty: "하",
                difficultyClass: "diff-low",
                score: 5
            },
            {
                text: "대한민국을 대표하는 유가증권시장 주가지수의 이름은?",
                options: ["NASDAQ", "NIKKEI", "KOSPI", "S&P 500"],
                correct: 2,
                difficulty: "하",
                difficultyClass: "diff-low",
                score: 5
            },
            {
                text: "현재 주가를 주당순이익(EPS)으로 나눈 것으로, 주식이 고평가되었는지 판단하는 대표적인 지표는?",
                options: ["PER (주가수익비율)", "PBR (주가순자산비율)", "ROE (자기자본이익률)", "BPS (주당순자산가치)"],
                correct: 0,
                difficulty: "중",
                difficultyClass: "diff-mid",
                score: 10
            },
            {
                text: "코스피/코스닥 지수가 급락하는 등 시장 전체가 급변할 때, 시장 전체의 거래를 일정 시간 일시 중단하는 제도는?",
                options: ["사이드카", "서킷브레이커", "VI (변동성 완화장치)", "공매도"],
                correct: 1,
                difficulty: "중",
                difficultyClass: "diff-mid",
                score: 10
            },
            {
                text: "단기 이동평균선이 장기 이동평균선을 아래에서 위로 뚫고 올라가는 현상으로, 주가 상승의 신호로 해석되는 것은?",
                options: ["골든크로스 (Golden Cross)", "데드크로스 (Dead Cross)", "손절매 (Stop Loss)", "물타기 (Scale Trading)"],
                correct: 0,
                difficulty: "중",
                difficultyClass: "diff-mid",
                score: 10
            },
            {
                text: "기업이 자본금을 늘리기 위해 주식을 추가로 발행하여 기존 주주나 일반인에게 돈을 받고 파는 것은?",
                options: ["유상증자", "무상감자", "자사주 매입", "액면분할"],
                correct: 0,
                difficulty: "중",
                difficultyClass: "diff-mid",
                score: 10
            },
            {
                text: "주가 하락이 예상될 때 주식을 빌려서 먼저 팔고, 나중에 싼 값에 사서 갚아 차익을 남기는 매매 기법은?",
                options: ["선물 거래 (Futures Trading)", "옵션 거래 (Options Trading)", "공매도 (Short Selling)", "스캘핑 (Scalping)"],
                correct: 2,
                difficulty: "상",
                difficultyClass: "diff-high",
                score: 15
            },
            {
                text: "특정 주가지수나 자산 가격의 움직임에 수익률이 연동되도록 설계된 '상장지수펀드'는?",
                options: ["ETF", "ELS", "REITs", "IPO"],
                correct: 0,
                difficulty: "상",
                difficultyClass: "diff-high",
                score: 15
            },
            {
                text: "기업이 투입한 자기자본 대비 얼마만큼의 이익을 냈는지 보여주는 수익성 지표는?",
                options: ["PER", "ROE", "ROA", "EBITDA"],
                correct: 1,
                difficulty: "상",
                difficultyClass: "diff-high",
                score: 15
            }
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;
        let selectedOptionIndex = null;

        function startTest() {
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
            showQuestion(0);
        }

        function backToStart() {
            document.getElementById('start-page').classList.remove('hidden');
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.add('hidden');
            currentQuestionIndex = 0;
            totalScore = 0;
            selectedOptionIndex = null;
            document.getElementById('next-btn-area').classList.remove('hidden');
            document.getElementById('final-btn-area').classList.add('hidden');
        }

        function showQuestion(index) {
            currentQuestionIndex = index;
            const question = questions[index];
            
            document.getElementById('question-text').textContent = question.text;
            document.getElementById('current-question-num').textContent = index + 1;
            document.getElementById('progress-bar').style.width = ((index + 1) / questions.length * 100) + '%';
            document.getElementById('question-score').textContent = question.score;
            
            // 난이도 배지 업데이트
            const badge = document.getElementById('difficulty-badge');
            badge.className = `difficulty-badge ${question.difficultyClass}`;
            badge.textContent = `난이도 ${question.difficulty}`;

            // 옵션 렌더링
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50';
                btn.onclick = () => selectOption(idx);
                btn.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span>${option}</span>
                        <i class="fas fa-check-circle opacity-0"></i>
                    </div>
                `;
                optionsContainer.appendChild(btn);
            });
            
            selectedOptionIndex = null;
            
            // 버튼 상태 초기화
            if (index === questions.length - 1) {
                document.getElementById('next-btn-area').classList.add('hidden');
                document.getElementById('final-btn-area').classList.remove('hidden');
                document.getElementById('final-submit-btn').disabled = true;
                document.getElementById('final-submit-btn').classList.remove('bg-point', 'text-white');
                document.getElementById('final-submit-btn').classList.add('bg-slate-200', 'text-slate-400');
            } else {
                document.getElementById('next-btn-area').classList.remove('hidden');
                document.getElementById('final-btn-area').classList.add('hidden');
                document.getElementById('next-btn').disabled = true;
                document.getElementById('next-btn').classList.remove('bg-point', 'text-white');
                document.getElementById('next-btn').classList.add('bg-slate-200', 'text-slate-400');
            }
        }

        function selectOption(index) {
            selectedOptionIndex = index;
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, idx) => {
                if (idx === index) {
                    btn.classList.add('selected');
                    btn.querySelector('i').classList.remove('opacity-0');
                    btn.querySelector('i').classList.add('opacity-100');
                } else {
                    btn.classList.remove('selected');
                    btn.querySelector('i').classList.add('opacity-0');
                    btn.querySelector('i').classList.remove('opacity-100');
                }
            });
            
            // 버튼 활성화
            if (currentQuestionIndex === questions.length - 1) {
                const finalBtn = document.getElementById('final-submit-btn');
                finalBtn.disabled = false;
                finalBtn.classList.remove('bg-slate-200', 'text-slate-400');
                finalBtn.classList.add('bg-point', 'text-white');
            } else {
                const nextBtn = document.getElementById('next-btn');
                nextBtn.disabled = false;
                nextBtn.classList.remove('bg-slate-200', 'text-slate-400');
                nextBtn.classList.add('bg-point', 'text-white');
            }
        }

        function nextQuestion() {
            if (selectedOptionIndex === null) return;
            
            // 정답 체크 및 점수 합산
            if (selectedOptionIndex === questions[currentQuestionIndex].correct) {
                totalScore += questions[currentQuestionIndex].score;
            }
            
            if (currentQuestionIndex < questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            }
        }

        function showResultDirect() {
            if (selectedOptionIndex === null) return;
            // 마지막 문제 점수 합산
            if (selectedOptionIndex === questions[currentQuestionIndex].correct) {
                totalScore += questions[currentQuestionIndex].score;
            }
            showResult();
        }

        function showResultWithCoupang() {
            if (selectedOptionIndex === null) return;
            // 마지막 문제 점수 합산
            if (selectedOptionIndex === questions[currentQuestionIndex].correct) {
                totalScore += questions[currentQuestionIndex].score;
            }
            window.open('https://link.coupang.com/a/ddddJ5', '_blank');
            setTimeout(() => {
                showResult();
            }, 100);
        }

        function goTest(targetUrl) {
            location.href = targetUrl;
        }

        function getResultType(score) {
            if (score >= 81) {
                return {
                    title: "차트 마스터",
                    subtitle: "고수 진입 구간",
                    emoji: "📈",
                    desc: "차트와 지표를 통해 흐름을 잘 읽는 편이에요. 다만 방심하지 말고 리스크 관리만 더 챙기면, 꾸준한 수익도 노려볼 수 있는 수준입니다.",
                    color: "from-red-500 to-rose-600",
                    img: "https://cdn-icons-png.flaticon.com/512/3310/3310624.png" // Chart icon
                };
            } else if (score >= 61) {
                return {
                    title: "주식 학부생",
                    subtitle: "공부 필요 (심화 단계)",
                    emoji: "🎓",
                    desc: "기초 개념은 어느 정도 알고 있지만, 실전 경험과 심화 공부가 더 필요해요. 재무제표, 차트, 리스크 관리 쪽을 조금만 더 파고들면 실력이 훨씬 올라갈 수 있습니다.",
                    color: "from-blue-500 to-indigo-600",
                    img: "https://cdn-icons-png.flaticon.com/512/3406/3406828.png" // Student icon
                };
            } else if (score >= 41) {
                return {
                    title: "평범한 개미",
                    subtitle: "기초 단계",
                    emoji: "🐜",
                    desc: "주식 용어나 기본 개념은 들어봤지만, 아직은 헷갈리는 부분이 많을 수 있어요. 당분간은 소액으로 연습하거나, ETF·적립식 위주로 천천히 익혀가는 걸 추천드립니다.",
                    color: "from-green-500 to-emerald-600",
                    img: "https://cdn-icons-png.flaticon.com/512/7006/7006778.png" // Ant icon
                };
            } else {
                return {
                    title: "주식 신생아",
                    subtitle: "예적금 추천 구간",
                    emoji: "👶",
                    desc: "아직 주식 시장은 꽤나 낯설고 위험한 곳일 수 있어요. 이 단계에서는 예·적금, CMA, 채권형 상품 등 안전자산 위주로 운용하면서, 주식은 공부용으로만 소액 경험해보는 걸 추천드립니다.",
                    color: "from-slate-400 to-slate-600",
                    img: "https://cdn-icons-png.flaticon.com/512/3050/3050257.png" // Baby icon
                };
            }
        }

        function showResult() {
            const result = getResultType(totalScore);
            
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            
            const resultHTML = `
                <div class="clean-card p-8 md:p-10 text-center bg-white">
                    <div class="mb-6 flex justify-center">
                        <div class="w-32 h-32 rounded-full bg-slate-50 flex items-center justify-center text-6xl shadow-inner">
                            ${result.emoji}
                        </div>
                    </div>
                    
                    <div class="text-sm font-bold text-slate-500 mb-1 tracking-wider uppercase">${result.subtitle}</div>
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-4">${result.title}</h2>
                    
                    <div class="mb-8">
                        <div class="text-5xl font-black bg-gradient-to-r ${result.color} bg-clip-text text-transparent mb-2">
                            ${totalScore}<span class="text-xl text-slate-400 ml-1 font-bold">점</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-4 mb-4 overflow-hidden">
                            <div class="bg-gradient-to-r ${result.color} h-4 rounded-full score-bar" style="width: 0%"></div>
                        </div>
                        <p class="text-slate-600 text-sm leading-relaxed px-4">${result.desc}</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 text-left">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div class="text-xs text-slate-400 mb-1">상위</div>
                            <div class="font-bold text-slate-700 text-lg">${100 - totalScore}%</div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div class="text-xs text-slate-400 mb-1">등급</div>
                            <div class="font-bold text-slate-700 text-lg">${getGrade(totalScore)}</div>
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex justify-center w-full overflow-hidden">
                    <iframe src="https://ads-partners.coupang.com/widgets.html?id=950069&template=carousel&trackingCode=AF3238435&subId=&width=680&height=160&tsource=" width="680" height="160" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics style="max-width: 100%;"></iframe>
                </div>

                <!-- 쿠팡 아이쇼핑 후 다른 서비스 둘러보기 -->
                <div class="mt-10 w-full max-w-3xl mx-auto">
                    <div class="text-center mb-6 relative">
                        <div class="absolute inset-0 flex items-center" aria-hidden="true">
                            <div class="w-full border-t border-white/30"></div>
                        </div>
                        <div class="relative flex justify-center">
                            <span class="bg-transparent px-4 text-xs font-bold text-white/80 tracking-widest uppercase">BONUS</span>
                        </div>
                        <h3 class="mt-4 text-white font-bold text-sm animate-bounce drop-shadow">
                            🔍 다른 서비스도 둘러보기
                        </h3>
                    </div>
                    
                    <div data-test-grid class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
                </div>
            `;
            
            document.getElementById('result-content').innerHTML = resultHTML;
            initTestGrids('/stock-knowledge');
            window.scrollTo(0, 0);
            
            setTimeout(() => {
                const bar = document.querySelector('.score-bar');
                if(bar) bar.style.width = totalScore + '%';
            }, 300);
        }

        function getGrade(score) {
            if (score >= 90) return "1등급";
            if (score >= 80) return "2등급";
            if (score >= 70) return "3등급";
            if (score >= 60) return "4등급";
            if (score >= 50) return "5등급";
            return "6등급 이하";
        }

        window.shareLink = function() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ 
                    title: '주식 능력고사 결과', 
                    text: `내 주식 점수는 ${totalScore}점! ${getResultType(totalScore).title} 등급입니다. 당신의 실력은?`, 
                    url: currentUrl 
                });
            } else {
                const t = document.createElement("textarea"); 
                document.body.appendChild(t); 
                t.value = currentUrl; 
                t.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(t); 
                alert('링크 복사 완료!');
            }
        }
    
        document.addEventListener('DOMContentLoaded', () => {
            initTestGrids('/stock-knowledge');
        });
    </script>
    
    <footer class="mt-12 pt-8 pb-6 text-center">
        <p class="text-xs text-white/70">
            © 2026 재밌는웹페이지연구소. All rights reserved.
        </p>
    </footer>
</body>
