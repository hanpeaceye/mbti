    <script>
        let selectedOptions = {
            birthYear: null,
            speed: null,
            stamina: null,
            mbti: null
        };

        function selectOption(type, value, element) {
            // 같은 타입의 다른 버튼들 선택 해제
            const buttons = element.parentElement.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.classList.remove('selected'));
            
            // 선택한 버튼 활성화
            element.classList.add('selected');
            selectedOptions[type] = value;
        }

        // 년생 입력 처리
        document.getElementById('birth-year').addEventListener('input', function(e) {
            selectedOptions.birthYear = parseInt(e.target.value);
        });

        function calculateStaminaLevel(birthYear, staminaInput) {
            if (!birthYear) return staminaInput;
            
            const currentYear = new Date().getFullYear();
            const age = currentYear - birthYear;
            
            // 나이에 따른 체력 보정
            let staminaAdjustment = staminaInput;
            
            if (age >= 35) {
                // 35세 이상: 체력 1단계 하향
                if (staminaInput === 'high') staminaAdjustment = 'mid';
                else if (staminaInput === 'mid') staminaAdjustment = 'low';
            } else if (age >= 30) {
                // 30-34세: 체력 약간 하향 (중->중, 상->중)
                if (staminaInput === 'high') staminaAdjustment = 'mid';
            } else if (age <= 25) {
                // 25세 이하: 체력 약간 상향
                if (staminaInput === 'mid') staminaAdjustment = 'high';
            }
            
            return staminaAdjustment;
        }

        function generateStrategy(birthYear, speed, stamina, mbti) {
            const adjustedStamina = calculateStaminaLevel(birthYear, stamina);
            
            // 전략 생성 로직
            let role = ''; // 경찰 or 도둑 추천
            let strategy = '';
            let tips = [];
            let playStyle = '';
            let equipment = [];
            
            // 1. 역할 추천 (속도 + 체력 기반)
            const speedScore = speed === 'high' ? 3 : speed === 'mid' ? 2 : 1;
            const staminaScore = adjustedStamina === 'high' ? 3 : adjustedStamina === 'mid' ? 2 : 1;
            const totalScore = speedScore + staminaScore;
            
            if (totalScore >= 5) {
                role = '도둑';
                playStyle = '공격적 도주형';
            } else if (totalScore >= 3) {
                role = '경찰';
                playStyle = '균형 추격형';
            } else {
                role = '경찰';
                playStyle = '전략 수비형';
            }
            
            // 2. MBTI 기반 전략 조정
            if (mbti === 'E') {
                // 외향형: 팀워크, 소통 강조
                if (role === '경찰') {
                    strategy = '무전기 활용이 핵심입니다. 팀원들과 실시간으로 정보를 공유하며 포위망을 좁혀가세요. 목소리가 크고 명확하게 지시를 내리면 팀의 리더 역할을 할 수 있습니다.';
                    tips.push('무전기로 "1번 게이트 도둑 발견, 2번 게이트로 차단!" 같은 명확한 지시를 내리세요');
                    tips.push('팀원들과 함께 움직이며 소통을 유지하면 승률이 높아집니다');
                } else {
                    strategy = '혼자 도망치지 말고 팀원들과 연락을 유지하세요. 경찰의 위치를 공유하고 함께 작전을 짜면 생존률이 높아집니다.';
                    tips.push('도둑 팀원들과 위치를 공유하며 협력하세요');
                    tips.push('경찰이 포위할 때는 팀원들과 함께 탈출 경로를 만들어야 합니다');
                }
                equipment.push('무전기 앱 필수');
            } else {
                // 내향형: 혼자서도 잘하는 전략
                if (role === '경찰') {
                    strategy = '조용히 은밀하게 움직이며 도둑의 예상 경로를 미리 차단하세요. 큰 소리로 소통하기보다는 혼자서도 효과적으로 작전을 수행할 수 있습니다.';
                    tips.push('혼자 조용히 이동하며 도둑의 이동 패턴을 관찰하세요');
                    tips.push('시끄러운 무전기보다는 조용한 관찰과 예측이 더 효과적입니다');
                } else {
                    strategy = '혼자서도 잘 도망칠 수 있습니다. 조용히 이동하며 경찰의 시야에서 벗어나는 것이 핵심입니다. 시끄러운 팀원들과 떨어져서 움직이세요.';
                    tips.push('혼자 조용히 이동하며 경찰의 시야를 피하세요');
                    tips.push('은밀한 장소에 숨어서 시간을 벌 수 있습니다');
                }
                equipment.push('조용한 이동이 가능한 가벼운 복장');
            }
            
            // 3. 속도 기반 전술
            if (speed === 'high') {
                if (role === '도둑') {
                    strategy += ' 빠른 발을 활용해 경찰과 직접적인 추격전을 피하고, 한 번에 멀리 도망치세요.';
                    tips.push('직선 거리를 활용한 빠른 도주가 유리합니다');
                } else {
                    strategy += ' 빠른 속도로 도둑을 직접 추격할 수 있습니다. 하지만 혼자서 달리지 말고 팀원과 협력하세요.';
                    tips.push('직접 추격보다는 도둑의 예상 경로를 차단하는 것이 효율적입니다');
                }
            } else if (speed === 'low') {
                if (role === '도둑') {
                    strategy += ' 속도가 느리므로 미리 경찰의 위치를 파악하고 우회 경로를 택하세요.';
                    tips.push('직접적인 추격전은 피하고, 미리 숨을 장소를 파악하세요');
                    tips.push('감옥 근처에 숨어서 팀원을 구출하는 역할이 적합합니다');
                } else {
                    strategy += ' 속도가 느리므로 전략적 배치가 중요합니다. 감옥 근처나 중요한 교차로를 지키는 역할이 적합합니다.';
                    tips.push('감옥 수비나 특정 구역 지키기가 효과적입니다');
                }
            }
            
            // 4. 체력 기반 전술
            if (adjustedStamina === 'high') {
                strategy += ' 체력이 좋으니 장시간 게임에도 지치지 않습니다. 지속적인 이동과 추격이 가능합니다.';
                tips.push('체력을 활용한 지속적인 압박이 가능합니다');
            } else if (adjustedStamina === 'low') {
                strategy += ' 체력이 부족하니 짧고 강렬한 움직임을 하세요. 장시간 달리기는 피하고 전략적으로 움직이세요.';
                tips.push('짧은 거리 이동과 숨기 전략이 효과적입니다');
                tips.push('체력 회복을 위해 중간중간 숨을 곳을 활용하세요');
            }
            
            // 5. 역할별 추가 전략
            if (role === '경찰') {
                tips.push('도둑의 예상 이동 경로를 미리 차단하는 것이 핵심입니다');
                tips.push('팀원들과 함께 포위망을 만들어 도둑을 가두세요');
                equipment.push('무전기 앱 (Zello 등)');
                equipment.push('형광 조끼 (팀 식별용)');
            } else {
                tips.push('경찰의 시야에서 벗어나는 것이 최우선입니다');
                tips.push('감옥에 갇힌 팀원을 구출하는 것도 승리의 열쇠입니다');
                equipment.push('가벼운 복장');
                equipment.push('위치 공유 앱 (도둑 팀원들과)');
            }
            
            return {
                role,
                playStyle,
                strategy,
                tips,
                equipment,
                totalScore,
                adjustedStamina
            };
        }

        function showResultDirect() {
            if (!selectedOptions.birthYear || !selectedOptions.speed || !selectedOptions.stamina || !selectedOptions.mbti) {
                alert('모든 항목을 입력해주세요!');
                return;
            }
            
            const result = generateStrategy(
                selectedOptions.birthYear,
                selectedOptions.speed,
                selectedOptions.stamina,
                selectedOptions.mbti
            );
            
            displayResult(result, false);
        }

        function showResultWithCoupang() {
            if (!selectedOptions.birthYear || !selectedOptions.speed || !selectedOptions.stamina || !selectedOptions.mbti) {
                alert('모든 항목을 입력해주세요!');
                return;
            }
            
            window.open('https://link.coupang.com/a/ddddJ5', '_blank');
            setTimeout(() => {
                const result = generateStrategy(
                    selectedOptions.birthYear,
                    selectedOptions.speed,
                    selectedOptions.stamina,
                    selectedOptions.mbti
                );
                displayResult(result, true);
            }, 100);
        }

        function displayResult(result, withCoupang) {
            const resultHTML = `
                <div class="clean-card p-6 md:p-8 text-center">
                    <div class="mb-6">
                        <span class="inline-block bg-purple-100 text-purple-600 text-xs font-bold px-3 py-1 rounded-full mb-3">추천 역할</span>
                        <h2 class="text-4xl font-black text-slate-800 mb-2">
                            <span class="text-point">${result.role}</span> 팀
                        </h2>
                        <p class="text-slate-500 font-bold">${result.playStyle}</p>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-full h-4 mb-6 overflow-hidden">
                        <div class="bg-point h-4 rounded-full transition-all duration-1000" style="width: ${(result.totalScore / 6) * 100}%"></div>
                    </div>
                </div>

                <div class="clean-card p-6 md:p-8">
                    <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                        <i class="fas fa-lightbulb text-yellow-500"></i> 맞춤 전략
                    </h3>
                    <div class="strategy-card p-5 rounded-xl mb-4">
                        <p class="text-slate-700 leading-relaxed text-sm">${result.strategy}</p>
                    </div>
                </div>

                <div class="clean-card p-6 md:p-8">
                    <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                        <i class="fas fa-trophy text-orange-500"></i> 승리 팁
                    </h3>
                    <ul class="space-y-3 text-left">
                        ${result.tips.map(tip => `
                            <li class="flex items-start gap-3">
                                <span class="text-purple-500 mt-1"><i class="fas fa-check-circle"></i></span>
                                <span class="text-slate-700 text-sm leading-relaxed">${tip}</span>
                            </li>
                        `).join('')}
                    </ul>
                </div>

                <div class="clean-card p-6 md:p-8">
                    <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                        <i class="fas fa-shopping-bag text-blue-500"></i> 추천 준비물
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        ${result.equipment.map(item => `
                            <div class="bg-slate-50 p-4 rounded-xl text-center border border-slate-200">
                                <p class="text-slate-700 font-bold text-sm">${item}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${withCoupang ? `
                <div class="clean-card p-6 md:p-8 bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300">
                    <h3 class="font-bold text-slate-800 text-lg mb-2 flex items-center gap-2">
                        <i class="fas fa-star text-yellow-500"></i> 프리미엄 전략
                    </h3>
                    <p class="text-slate-600 text-sm mb-4">쿠팡에서 쇼핑하신 분들을 위한 추가 전략입니다!</p>
                    <div class="bg-white p-4 rounded-xl">
                        <p class="text-slate-700 text-sm leading-relaxed">
                            ${result.role === '경찰' ? 
                                '• 도둑의 심리 상태를 파악하세요. 도망칠 때 보통 숨이 차서 방심하는 순간이 있습니다.<br>• 팀원들과 신호 체계를 미리 정해두면 더 효율적입니다.<br>• 감옥 근처에 함정을 설치하는 것도 좋은 전략입니다.' :
                                '• 경찰의 패턴을 관찰하세요. 같은 경로를 반복하는 경우가 많습니다.<br>• 감옥 근처에 미리 숨어서 팀원 구출 타이밍을 노리세요.<br>• 경찰이 한 명만 있을 때는 역습도 가능합니다.'
                            }
                        </p>
                    </div>
                </div>
                ` : ''}
            `;
            
            document.getElementById('result-content').innerHTML = resultHTML;
            document.getElementById('input-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('input-page').classList.remove('hidden');
            document.getElementById('result-page').classList.add('hidden');
            // 입력값 초기화
            selectedOptions = { birthYear: null, speed: null, stamina: null, mbti: null };
            document.getElementById('birth-year').value = '';
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
        });

        window.shareLink = function() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ 
                    title: '경도 게임 전략 추천', 
                    text: '나만의 맞춤 경도 게임 전략을 확인했어요! 🚔', 
                    url: currentUrl 
                });
            } else {
                const t = document.createElement("textarea"); 
                document.body.appendChild(t); 
                t.value = currentUrl; 
                t.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(t); 
                alert('링크 복사 완료!');
            }
        }
    </script>
</body>
</html>
