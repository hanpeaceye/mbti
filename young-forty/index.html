<body class="min-h-screen relative pb-10">

    <div class="w-full max-w-3xl mx-auto px-4 py-10">

        <!-- 시작 페이지 -->

                <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3 leading-tight">
                    내가 설마<br><span class="text-white">영포티</span>일까?

                        가볍게 농담처럼 쓰이기도 하는 표현이에요.<br>
                        <span class="font-semibold text-slate-700">나는 어느 쪽인지</span> 간단히 체크해보세요.
                    </p>

                <button onclick="startTest()" class="w-full bg-point hover:opacity-90 text-white font-bold py-4 rounded-xl shadow-lg text-base transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
                    <span>검사 시작하기</span> <i class="fas fa-arrow-right"></i>

        <!-- 질문 페이지 -->

                </button>
                <span class="text-[10px] font-bold text-white bg-white/20 backdrop-blur px-2 py-1 rounded">질문 <span id="current-question-num">1</span>/8</span>
            </div>

            <div class="clean-card p-6 md:p-8 question-card bg-white">
                <div class="mb-6">
                    <div class="w-full bg-slate-100 rounded-full h-2 mb-4">
                        <div id="progress-bar" class="bg-point h-2 rounded-full transition-all duration-300" style="width: 12.5%"></div>
                    </div>
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-2 leading-tight"></h2>

                <div class="space-y-3">
                    <button onclick="selectAnswer(5)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">

                            <span>매우 그렇다</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                    <button onclick="selectAnswer(4)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>그렇다</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                    <button onclick="selectAnswer(3)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>보통</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                    <button onclick="selectAnswer(2)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>아니다</span>
                            <i class="fas fa-check-circle opacity-0"></i>

                    </button>
                    <button onclick="selectAnswer(1)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>매우 아니다</span>

                    </button>

                <button id="next-btn" onclick="nextQuestion()" class="w-full mt-6 bg-slate-200 text-slate-400 font-bold py-4 rounded-xl text-base transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" disabled>
                    <span>다음 질문</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- 결과 페이지 -->
        <div id="result-page" class="hidden fade-in">
            <div class="flex items-center justify-between mb-6">
                <button id="back-btn" onclick="backToStart()" class="text-white/85 hover:text-white font-medium text-sm flex items-center gap-2 transition-colors">
                    <i class="fas fa-chevron-left"></i> 다시하기
                </button>
                <span class="text-[10px] font-bold text-white bg-white/20 backdrop-blur px-2 py-1 rounded">RESULT</span>
            </div>

            <div id="result-content" class="space-y-6"></div>

            <div class="mt-8 flex flex-col md:flex-row items-center justify-center gap-3 w-full px-4">
                <button onclick="shareLink()" class="w-full md:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-white border border-purple-200 rounded-full shadow-sm text-slate-600 font-bold hover:bg-purple-50 transition-all text-sm group">
                    <i class="fas fa-share-alt group-hover:text-purple-600 transition-colors"></i> 결과 공유하기
                </button>

        </div>

    </div>

    <div class="fixed bottom-2 right-2 text-[10px] text-white/50 font-mono pointer-events-none select-none z-50">
        Ver 1.0
    </div>

    <script>
        // 질문 데이터
        const questions = [
            {
                text: "나는 또래에 비해 최신 SNS 기능을 비교적 빨리 익히는 편이다.",
                category: "디지털",
                reverse: false
            },
            {
                text: "너무 무난한 것보단 약간의 킥이 있는 걸 선호한다.",
                category: "취향",
                reverse: false
            },
            {
                text: "최신 유행(음악/드라마/유튜브 등)을 놓치지 않으려고 챙겨보는 편이다.",
                category: "콘텐츠",
                reverse: false
            },
            {
                text: "옷/헤어스타일은 이상하지 않을 정도만 하고 다니면 된다고 생각한다.",
                category: "스타일",
                reverse: true
            },
            {
                text: "여자 동료가 집에 잘 들어갔는지 관심을 갖는 건 당연한 매너라고 생각한다.",
                category: "매너",
                reverse: false
            },
            {
                text: "SNS에 사진을 올릴 때, 나만의 편한 스타일이 좋고 많은 사람들이 하는 건 굳이 시도해보고 싶지 않다.",
                category: "SNS",
                reverse: true
            },
            {
                text: "남자들끼리는 나이차이에 따라 약간의 서열이 있는 게 자연스럽다고 생각한다.",
                category: "관계",
                reverse: false
            },
            {
                text: "남자가 너무 빨리 가정을 꾸리는 것보단 오히려 조금 늦더라도 놀만큼 놀고 가정을 꾸리는 게 안정적이라 생각한다.",
                category: "가치관",
                reverse: false
            }
        ];

        let currentQuestionIndex = 0;
        let answers = [];
        let selectedAnswer = null;

        function startTest() {
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
            showQuestion(0);
        }

        function backToStart() {
            document.getElementById('start-page').classList.remove('hidden');
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.add('hidden');
            currentQuestionIndex = 0;
            answers = [];
            selectedAnswer = null;
            resetButtons();
        }

        function showQuestion(index) {
            currentQuestionIndex = index;
            const question = questions[index];
            
            document.getElementById('question-text').textContent = question.text;
            document.getElementById('current-question-num').textContent = index + 1;
            document.getElementById('progress-bar').style.width = ((index + 1) / questions.length * 100) + '%';
            
            selectedAnswer = null;
            resetButtons();
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').classList.remove('bg-point', 'text-white');
            document.getElementById('next-btn').classList.add('bg-slate-200', 'text-slate-400');
        }

        function selectAnswer(score) {
            selectedAnswer = score;
            resetButtons();
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, index) => {
                if (index === (5 - score)) {
                    btn.classList.add('selected');
                    btn.querySelector('i').classList.remove('opacity-0');
                    btn.querySelector('i').classList.add('opacity-100');
                }
            });
            
            document.getElementById('next-btn').disabled = false;
            document.getElementById('next-btn').classList.remove('bg-slate-200', 'text-slate-400');
            document.getElementById('next-btn').classList.add('bg-point', 'text-white');
        }

        function resetButtons() {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                btn.classList.remove('selected');
                const icon = btn.querySelector('i');
                icon.classList.add('opacity-0');
                icon.classList.remove('opacity-100');
            });
        }

        function nextQuestion() {
            if (selectedAnswer === null) return;
            
            answers.push(selectedAnswer);
            
            if (currentQuestionIndex < questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            } else {
                showResult();
            }
        }

        function calculateScore() {
            // 각 답변: 매우 그렇다(5), 그렇다(4), 보통(3), 아니다(2), 매우 아니다(1)
            // 총점: 8개 질문 * 1점 = 8점 (최소) ~ 8개 질문 * 5점 = 40점 (최대)
            const adjustedScores = answers.map((raw, idx) => {
                const q = questions[idx];
                if (q && q.reverse) return 6 - raw; // 역문항
                return raw;
            });
            const totalScore = adjustedScores.reduce((sum, score) => sum + score, 0);
            // 100점 만점으로 변환(기본 선형)
            const linear = ((totalScore - 8) / (40 - 8)) * 100;
            // 일반적으로 '매우 아니다'를 잘 선택하지 않는 점을 반영해,
            // 중간대 점수가 조금 더 잘 올라가도록 완만한 곡선 보정을 적용
            const curveExponent = 0.75; // 1보다 작을수록(0~1) 점수가 전반적으로 올라감
            const curved = Math.round(Math.pow(Math.min(100, Math.max(0, linear)) / 100, curveExponent) * 100);
            return Math.min(100, Math.max(0, curved));
        }

        function buildOverallComment(adjustedScores) {
            const avg = adjustedScores.reduce((s, v) => s + v, 0) / adjustedScores.length; // 1~5
            const min = Math.min(...adjustedScores);
            const max = Math.max(...adjustedScores);
            const range = max - min;

            let base;
            if (avg >= 4.3) {
                base = "전반적으로 ‘요즘 감각’에 민감하고 새로운 시도를 편하게 하는 편이에요. 다만 모든 상황에서 한 톤으로 밀기보다, 분위기와 상대에 맞춰 강약을 조절하면 더 세련돼 보여요.";
            } else if (avg >= 3.6) {
                base = "새로운 것에 관심이 많지만 과하게 휘둘리진 않아요. 필요한 건 빠르게 따라가고, 나머지는 내 페이스를 지키는 타입입니다.";
            } else if (avg >= 2.8) {
                base = "필요할 때만 적당히 참고하는 실용형이에요. 주변 분위기에 맞춰 선택하는 편이라 ‘영포티’ 걱정은 크게 없어 보여요.";
            } else {
                base = "익숙함과 안정감을 더 선호하는 편이에요. 새 흐름은 꼭 따라가기보다, 필요할 때만 가볍게 참고해도 충분합니다.";
            }

            if (range >= 3) {
                return base + " 그리고 영역별로 온도차가 큰 편이라, 관심 있는 분야만 확실히 챙기는 성향이 보입니다.";
            }
            return base;
        }

        function getResultType(score) {
            if (score >= 80) {
                return {
                    title: "🚨 트렌드 레이더 MAX",
                    emoji: "🛰️",
                    desc: "또래 대비 트렌드 반응 속도가 빠른 편이에요. ‘영포티’ 농담을 들을 확률이 있습니다.",
                    detail: "새로운 것에 열려 있는 건 큰 장점이에요. 다만 ‘센스’가 ‘과시’로 비치지 않도록, 상황에 맞게 강약만 조절하면 훨씬 더 멋있어질 타입입니다.",
                    color: "from-violet-500 to-cyan-500",
                    img: "img/type_young.png"
                };
            } else if (score >= 60) {
                return {
                    title: "⚖️ 트렌드 민감형",
                    emoji: "📡",
                    desc: "최신 트렌드에 관심이 많은 편이에요. ‘영포티’와 ‘센스’ 사이 어딘가!",
                    detail: "유행을 잘 읽는 편이라 대화 소재가 풍부합니다. ‘내가 요즘을 좀 안다’는 티가 과해질 때만 살짝 조절하면 호감도가 더 올라가요.",
                    color: "from-sky-500 to-violet-500",
                    img: "img/type_young.png"
                };
            } else if (score >= 40) {
                return {
                    title: "😌 밸런스형",
                    emoji: "🧩",
                    desc: "유행도 챙기고, 나만의 페이스도 지키는 편이에요. ‘영포티’ 걱정은 크게 없어요.",
                    detail: "필요할 때는 트렌드도 따라가고, 아닐 때는 과감히 안 하는 타입. 가장 무난하게 호감받는 균형형입니다.",
                    color: "from-emerald-500 to-teal-500",
                    img: "img/type_balance.png"
                };
            } else {
                return {
                    title: "🧱 클래식 안정형",
                    emoji: "🕴️",
                    desc: "트렌드보다 ‘내 스타일’이 우선인 타입이에요. 영포티와는 거리가 멉니다.",
                    detail: "유행을 억지로 따라가기보다 본인 기준이 뚜렷합니다. 필요할 때만 가볍게 트렌드를 참고하면 더 완성도 있는 인상으로 보일 수 있어요.",
                    color: "from-slate-500 to-gray-500",
                    img: "img/type_classic.png"
                };
            }
        }

        function showResult() {
            const score = calculateScore();
            const result = getResultType(score);
            const adjustedScores = answers.map((raw, idx) => {
                const q = questions[idx];
                if (q && q.reverse) return 6 - raw;
                return raw;
            });
            const overallComment = buildOverallComment(adjustedScores);
            
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            
            const resultHTML = `
                <div class="clean-card p-8 md:p-10 text-center bg-white">
                    <div class="mb-6 flex justify-center">
                        <img src="${result.img}" alt="영포티 결과 이미지" class="w-40 h-40 object-cover rounded-full shadow-lg border-4 border-slate-100">
                    </div>
                    
                    <div class="text-4xl mb-2">${result.emoji}</div>
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2">${result.title}</h2>
                    <p class="text-slate-600 text-base mb-6 leading-relaxed">${result.desc}</p>
                    
                    <div class="mb-6">
                        <div class="text-5xl font-black bg-gradient-to-r ${result.color} bg-clip-text text-transparent mb-2">
                            ${score}<span class="text-xl text-slate-400 ml-1 font-bold">영포티 지수</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-4 mb-4 overflow-hidden">
                            <div class="bg-gradient-to-r ${result.color} h-4 rounded-full score-bar" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 text-left text-sm text-slate-700 leading-relaxed">
                        <p class="font-bold text-slate-800 mb-2">📝 종합 평가</p>
                        <p>${overallComment}</p>
                    </div>
                </div>
            `;
            
            document.getElementById('result-content').innerHTML = resultHTML;
            window.scrollTo(0, 0);
            
            setTimeout(() => {
                const bar = document.querySelector('.score-bar');
                if(bar) bar.style.width = score + '%';
            }, 300);
        }

        window.shareLink = function() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ 
                    title: '영포티 검사 결과', 
                    text: `나는 ${calculateScore()}점! ${getResultType(calculateScore()).title} 결과를 확인해보세요!`, 
                    url: currentUrl 
                });
            } else {
                const t = document.createElement("textarea"); 
                document.body.appendChild(t); 
                t.value = currentUrl; 
                t.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(t); 
                alert('링크 복사 완료!');
            }
        }
    </script>
    
    <footer class="mt-12 pt-8 pb-6 text-center">
        <p class="text-xs text-white/70">
            © 2026 재밌는웹페이지연구소. All rights reserved.
        </p>
    </footer>
</body>
