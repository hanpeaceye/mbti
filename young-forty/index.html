    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #334155; min-height: 100vh; }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .text-point { color: #667eea; }
        .bg-point { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .score-bar { transition: width 1.5s ease-out; }
        
        .answer-btn { 
            transition: all 0.3s ease; 
            border: 2px solid #e2e8f0;
        }
        .answer-btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .answer-btn.selected { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .question-card {
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }

<body class="min-h-screen relative pb-10">

    <div class="w-full max-w-3xl mx-auto px-4 py-8">

        <!-- 시작 페이지 -->
        <div id="start-page" class="flex flex-col justify-center min-h-[80vh] fade-in">
            <div class="text-center mb-10">
                <span class="inline-block bg-white border border-purple-200 text-purple-600 text-xs font-bold px-3 py-1 rounded-full mb-3 tracking-wide">Young Forty Test</span>
                <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3 leading-tight drop-shadow-lg">
                    나는 진짜<br><span class="text-yellow-300">영포티</span>일까? 🎯
                </h1>
                <p class="text-white/90 text-sm md:text-base drop-shadow">5가지 질문으로 알아보는<br>영포티 성향 검사 · 2026년 최신판</p>
            </div>

            <div class="clean-card p-8 md:p-10 shadow-2xl bg-white">
                <div class="text-center mb-6">
                    <div class="w-20 h-20 bg-gradient-to-br from-purple-400 to-indigo-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                        🎨
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2">영포티란?</h2>
                    <p class="text-sm text-slate-600 leading-relaxed">
                        40대이면서도 젊은 감각과 라이프스타일을 유지하는 세대를 의미합니다.<br>
                        디지털 기기 사용, 트렌드 수용, 건강 관리, 문화 활동 등<br>
                        다양한 영역에서 젊은 마인드를 가진 분들을 위한 검사입니다.
                    </p>
                </div>
                
                <button onclick="startTest()" class="w-full bg-point hover:opacity-90 text-white font-bold py-4 rounded-xl shadow-lg text-base transition-all transform active:scale-[0.98] flex items-center justify-center gap-2">
                    <span>검사 시작하기</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- 질문 페이지 -->
        <div id="question-page" class="hidden fade-in">
            <div class="flex items-center justify-between mb-6">
                <button id="back-to-start" onclick="backToStart()" class="text-white hover:text-yellow-200 font-medium text-sm flex items-center gap-2 transition-colors drop-shadow">
                    <i class="fas fa-chevron-left"></i> 처음으로
                </button>
                <span class="text-[10px] font-bold text-white bg-white/20 backdrop-blur px-2 py-1 rounded">질문 <span id="current-question-num">1</span>/5</span>
            </div>

            <div class="clean-card p-6 md:p-8 question-card bg-white">
                <div class="mb-6">
                    <div class="w-full bg-slate-100 rounded-full h-2 mb-4">
                        <div id="progress-bar" class="bg-point h-2 rounded-full transition-all duration-300" style="width: 20%"></div>
                    </div>
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-2 leading-tight"></h2>
                </div>

                <div class="space-y-3">
                    <button onclick="selectAnswer(4)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>매우 그렇다</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                    <button onclick="selectAnswer(3)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>그렇다</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                    <button onclick="selectAnswer(2)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>아니다</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                    <button onclick="selectAnswer(1)" class="answer-btn w-full p-4 rounded-xl text-left font-medium text-slate-700 bg-slate-50">
                        <div class="flex items-center justify-between">
                            <span>매우 아니다</span>
                            <i class="fas fa-check-circle opacity-0"></i>
                        </div>
                    </button>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="w-full mt-6 bg-slate-200 text-slate-400 font-bold py-4 rounded-xl text-base transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" disabled>
                    <span>다음 질문</span> <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- 결과 페이지 -->
        <div id="result-page" class="hidden fade-in">
            <div class="flex items-center justify-between mb-6">
                <button id="back-btn" onclick="backToStart()" class="text-white hover:text-yellow-200 font-medium text-sm flex items-center gap-2 transition-colors drop-shadow">
                    <i class="fas fa-chevron-left"></i> 다시하기
                </button>
                <span class="text-[10px] font-bold text-white bg-white/20 backdrop-blur px-2 py-1 rounded">RESULT</span>
            </div>

            <div id="result-content" class="space-y-6"></div>

            <div class="mt-8 flex flex-col md:flex-row items-center justify-center gap-3 w-full px-4">
                <button onclick="shareLink()" class="w-full md:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-white border border-purple-200 rounded-full shadow-sm text-slate-600 font-bold hover:bg-purple-50 transition-all text-sm group">
                    <i class="fas fa-share-alt group-hover:text-purple-600 transition-colors"></i> 결과 공유하기
                </button>
            </div>
        </div>

    </div>

    <div class="fixed bottom-2 right-2 text-[10px] text-white/50 font-mono pointer-events-none select-none z-50">
        Ver 1.0
    </div>

    <script>
        // 질문 데이터
        const questions = [
            {
                text: "최신 스마트폰 앱이나 SNS 기능을 배우는 게 어렵지 않고, 새로운 디지털 트렌드를 빠르게 따라잡는다.",
                category: "디지털 능력"
            },
            {
                text: "20-30대 젊은 세대가 즐기는 음악, 드라마, 유튜브 콘텐츠를 자연스럽게 즐기고 공감한다.",
                category: "트렌드 수용"
            },
            {
                text: "건강 관리와 체형 관리를 위해 운동이나 다이어트를 꾸준히 하고, 외모 관리에 신경을 쓴다.",
                category: "건강 관리"
            },
            {
                text: "전시회, 공연, 여행, 맛집 탐방 등 다양한 문화 활동을 즐기고, 새로운 경험을 추구한다.",
                category: "문화 활동"
            },
            {
                text: "자기계발과 새로운 학습에 적극적이며, '나이 때문에 못하겠다'는 생각보다 '해볼 수 있다'는 마인드를 가진다.",
                category: "자기계발"
            }
        ];

        let currentQuestionIndex = 0;
        let answers = [];
        let selectedAnswer = null;

        function startTest() {
            document.getElementById('start-page').classList.add('hidden');
            document.getElementById('question-page').classList.remove('hidden');
            showQuestion(0);
        }

        function backToStart() {
            document.getElementById('start-page').classList.remove('hidden');
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.add('hidden');
            currentQuestionIndex = 0;
            answers = [];
            selectedAnswer = null;
            resetButtons();
        }

        function showQuestion(index) {
            currentQuestionIndex = index;
            const question = questions[index];
            
            document.getElementById('question-text').textContent = question.text;
            document.getElementById('current-question-num').textContent = index + 1;
            document.getElementById('progress-bar').style.width = ((index + 1) / questions.length * 100) + '%';
            
            selectedAnswer = null;
            resetButtons();
            document.getElementById('next-btn').disabled = true;
            document.getElementById('next-btn').classList.remove('bg-point', 'text-white');
            document.getElementById('next-btn').classList.add('bg-slate-200', 'text-slate-400');
        }

        function selectAnswer(score) {
            selectedAnswer = score;
            resetButtons();
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, index) => {
                if (index === (4 - score)) {
                    btn.classList.add('selected');
                    btn.querySelector('i').classList.remove('opacity-0');
                    btn.querySelector('i').classList.add('opacity-100');
                }
            });
            
            document.getElementById('next-btn').disabled = false;
            document.getElementById('next-btn').classList.remove('bg-slate-200', 'text-slate-400');
            document.getElementById('next-btn').classList.add('bg-point', 'text-white');
        }

        function resetButtons() {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                btn.classList.remove('selected');
                const icon = btn.querySelector('i');
                icon.classList.add('opacity-0');
                icon.classList.remove('opacity-100');
            });
        }

        function nextQuestion() {
            if (selectedAnswer === null) return;
            
            answers.push(selectedAnswer);
            
            if (currentQuestionIndex < questions.length - 1) {
                showQuestion(currentQuestionIndex + 1);
            } else {
                showResult();
            }
        }

        function calculateScore() {
            // 각 답변: 매우 그렇다(4), 그렇다(3), 아니다(2), 매우 아니다(1)
            // 총점: 5점 * 4 = 20점 (최소) ~ 5점 * 4 = 20점 (최대)
            const totalScore = answers.reduce((sum, score) => sum + score, 0);
            // 100점 만점으로 변환: (총점 - 5) / (20 - 5) * 100
            const percentage = Math.round(((totalScore - 5) / (20 - 5)) * 100);
            return Math.min(100, Math.max(0, percentage));
        }

        function getResultType(score) {
            if (score >= 80) {
                return {
                    title: "🔥 진정한 영포티!",
                    emoji: "🎉",
                    desc: "당신은 완벽한 영포티입니다! 젊은 감각과 활력을 가진 진정한 영포티의 모습을 보여주고 있어요.",
                    detail: "디지털 기기 사용부터 트렌드 수용, 건강 관리, 문화 활동까지 모든 영역에서 젊은 마인드를 유지하고 있습니다. 주변 사람들이 부러워할 만한 라이프스타일을 살고 계시네요!",
                    color: "from-purple-500 to-pink-500"
                };
            } else if (score >= 60) {
                return {
                    title: "✨ 준영포티!",
                    emoji: "🌟",
                    desc: "당신은 영포티에 가까운 준영포티입니다. 대부분의 영역에서 젊은 마인드를 보유하고 있어요.",
                    detail: "몇 가지 영역에서 더 노력하면 완벽한 영포티가 될 수 있습니다. 새로운 것에 대한 도전 정신을 조금만 더 키우면 완벽해질 거예요!",
                    color: "from-blue-500 to-purple-500"
                };
            } else if (score >= 40) {
                return {
                    title: "💼 일반 40대",
                    emoji: "📊",
                    desc: "당신은 평범한 40대입니다. 영포티와는 거리가 있지만, 나름의 라이프스타일을 즐기고 계시네요.",
                    detail: "일부 영역에서는 젊은 감각을 보이지만, 전반적으로는 전통적인 40대의 모습을 보이고 있습니다. 새로운 경험에 조금만 더 도전해보면 어떨까요?",
                    color: "from-gray-500 to-gray-600"
                };
            } else {
                return {
                    title: "🏛️ 클래식 40대",
                    emoji: "📚",
                    desc: "당신은 전통적인 40대입니다. 영포티와는 거리가 멀지만, 안정적이고 차분한 라이프스타일을 선호하시는군요.",
                    detail: "젊은 트렌드보다는 자신만의 확고한 가치관과 라이프스타일을 가지고 계십니다. 때로는 새로운 경험도 시도해보는 것도 좋을 것 같아요!",
                    color: "from-slate-500 to-slate-600"
                };
            }
        }

        function showResult() {
            const score = calculateScore();
            const result = getResultType(score);
            
            document.getElementById('question-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            
            const resultHTML = `
                <div class="clean-card p-8 md:p-10 text-center bg-white">
                    <div class="text-6xl mb-4">${result.emoji}</div>
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2">${result.title}</h2>
                    <p class="text-slate-600 text-base mb-6 leading-relaxed">${result.desc}</p>
                    
                    <div class="mb-6">
                        <div class="text-5xl font-black bg-gradient-to-r ${result.color} bg-clip-text text-transparent mb-2">${score}<span class="text-2xl text-slate-300">/100</span></div>
                        <div class="w-full bg-slate-100 rounded-full h-4 mb-4 overflow-hidden">
                            <div class="bg-gradient-to-r ${result.color} h-4 rounded-full score-bar" style="width: 0%"></div>
                        </div>
                    </div>
                    
                    <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 text-left text-sm text-slate-700 leading-relaxed">
                        <p class="font-bold text-slate-800 mb-2">📋 상세 분석</p>
                        <p>${result.detail}</p>
                    </div>
                </div>

                <div class="clean-card p-6 md:p-8 bg-white">
                    <h3 class="font-bold text-slate-800 text-lg mb-4 text-center">📊 영역별 점수</h3>
                    <div class="space-y-4">
                        ${questions.map((q, index) => {
                            const answerScore = answers[index];
                            const answerText = answerScore === 4 ? '매우 그렇다' : answerScore === 3 ? '그렇다' : answerScore === 2 ? '아니다' : '매우 아니다';
                            const answerPercentage = ((answerScore - 1) / 3) * 100;
                            return `
                                <div class="bg-slate-50 p-4 rounded-xl">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-sm font-medium text-slate-700">${q.category}</span>
                                        <span class="text-xs text-slate-500">${answerText}</span>
                                    </div>
                                    <div class="w-full bg-slate-200 rounded-full h-2">
                                        <div class="bg-gradient-to-r ${result.color} h-2 rounded-full" style="width: ${answerPercentage}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            
            document.getElementById('result-content').innerHTML = resultHTML;
            window.scrollTo(0, 0);
            
            setTimeout(() => {
                const bar = document.querySelector('.score-bar');
                if(bar) bar.style.width = score + '%';
            }, 300);
        }

        window.shareLink = function() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ 
                    title: '영포티 검사 결과', 
                    text: `나는 ${calculateScore()}점! ${getResultType(calculateScore()).title} 결과를 확인해보세요!`, 
                    url: currentUrl 
                });
            } else {
                const t = document.createElement("textarea"); 
                document.body.appendChild(t); 
                t.value = currentUrl; 
                t.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(t); 
                alert('링크 복사 완료!');
            }
        }
    </script>
    
    <footer class="mt-12 pt-8 pb-6 text-center">
        <p class="text-xs text-white/70">
            © 2026 재밌는웹페이지연구소. All rights reserved.
        </p>
    </footer>
</body>
