        function findExercise(openCoupang = false) {
            const mbti = document.getElementById('mbti').value.toUpperCase().trim();

            if (!selectedGender || !mbti) {
                alert("성별과 MBTI를 모두 선택해주세요!");
                return;
            }

            if (!validMbtiList.includes(mbti)) {
                alert("정확한 MBTI 4글자를 입력해주세요! (예: ENFP)");
                return;
            }

            function displayResult() {
                const mbtiSpecificData = exerciseData[mbti];
                if (!mbtiSpecificData) {
                    alert("데이터 로딩 중 오류가 발생했습니다.");
                    return;
                }

                const genderData = mbtiSpecificData[selectedGender];
                const genderText = { "male": "남성", "female": "여성" };

                let recommendedHTML = genderData.recommended.map((exercise, index) => `
                    <div class="exercise-card exercise-card-recommended p-5 rounded-2xl shadow-sm mb-3">
                        <div class="flex items-start gap-3">
                            <div class="exercise-number text-2xl font-black flex-shrink-0 text-emerald-500">${index + 1}</div>
                            <div class="flex-1">
                                <h4 class="text-lg font-bold text-slate-800 mb-2">${exercise.name}</h4>
                                <p class="text-sm text-slate-600 mb-2 leading-relaxed">${exercise.reason}</p>
                                <p class="text-xs text-emerald-600 font-semibold bg-emerald-50 p-2 rounded-lg">💡 ${exercise.tip}</p>
                            </div>
                        </div>
                    </div>
                `).join('');

                let alternativeHTML = genderData.alternative.map((exercise, index) => `
                    <div class="exercise-card exercise-card-alternative p-5 rounded-2xl shadow-sm mb-3">
                        <div class="flex items-start gap-3">
                            <div class="exercise-number text-2xl font-black flex-shrink-0 text-amber-500">${index + 1}</div>
                            <div class="flex-1">
                                <h4 class="text-lg font-bold text-slate-800 mb-2">${exercise.name}</h4>
                                <p class="text-sm text-slate-600 mb-2 leading-relaxed">${exercise.reason}</p>
                                <p class="text-xs text-amber-600 font-semibold bg-amber-50 p-2 rounded-lg">💡 ${exercise.tip}</p>
                            </div>
                        </div>
                    </div>
                `).join('');

                const resultHTML = `
                    <div class="clean-card p-6 md:p-8 bg-white mb-6 text-center">
                        <span class="inline-block bg-pink-50 text-pink-600 text-xs font-bold px-3 py-1 rounded-full mb-3">2025 NEW YEAR EXERCISE</span>
                        <h2 class="text-2xl font-extrabold text-slate-800 mb-2">
                            <span class="text-point">${mbti}</span> ${genderText[selectedGender]}
                        </h2>
                        <p class="text-slate-500 text-sm word-keep">새해 시작하기 좋은 맞춤형 운동 추천</p>
                    </div>

                    <div class="clean-card p-6 md:p-8 bg-white mb-6">
                        <h3 class="text-lg font-bold text-emerald-600 mb-4 flex items-center gap-2">
                            <i class="fas fa-star"></i> 강력 추천 운동
                        </h3>
                        ${recommendedHTML}
                    </div>

                    <div class="clean-card p-6 md:p-8 bg-white">
                        <h3 class="text-lg font-bold text-amber-600 mb-4 flex items-center gap-2">
                            <i class="fas fa-lightbulb"></i> 대안 운동
                        </h3>
                        ${alternativeHTML}
                    </div>
                `;

                document.getElementById('result-content').innerHTML = resultHTML;
                document.getElementById('input-page').classList.add('hidden');
                document.getElementById('result-page').classList.remove('hidden');
                window.scrollTo(0, 0);
            }

            if (openCoupang) {
                window.open('https://link.coupang.com/a/ddddJ5', '_blank');
                setTimeout(() => { displayResult(); }, 100);
            } else {
                displayResult();
            }
        }

        function resetPage() {
            document.getElementById('input-page').classList.remove('hidden');
            document.getElementById('result-page').classList.add('hidden');
            document.getElementById('mbti').value = '';
            selectedGender = '';
            document.getElementById('gender-male').className = 'flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl p-4 text-center font-bold text-slate-600 transition-all hover:bg-pink-50 hover:border-pink-300';
            document.getElementById('gender-female').className = 'flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl p-4 text-center font-bold text-slate-600 transition-all hover:bg-pink-50 hover:border-pink-300';
            window.scrollTo(0, 0);

        function shareLink() {
            const currentUrl = window.location.href;
            if (navigator.share) {
                navigator.share({ title: '새해 운동 추천', text: '2025년 새해 시작하기 좋은 나에게 딱 맞는 운동을 찾았어! 너도 한번 해봐 💪', url: currentUrl });
            } else {
                const t = document.createElement("textarea"); 
                document.body.appendChild(t); 
                t.value = currentUrl; 
                t.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(t); 
                alert('링크 복사 완료!');
            }
        }
