                "ENTJ": { type: "카리스마 대장", like: "도전적이고 야망 있는 모습, 솔직한 화법, 일 잘하는 프로페셔널함, 자기계발", dislike: "의존적인 태도, 게으름, 시간 낭비하는 무의미한 대화, 우유부단함", tip: "주눅 들지 말고 당당하게 대하세요. 자신의 일에 몰입하고 성취해내는 멋진 모습을 보여줄 때 반합니다." }

            function getPairStrategy(myMbti, theirMbti) {

                const kakaoByTheir = {

            const formatList = (str) => {

                return 'bg-amber-50 border-amber-200 text-amber-900';

            // 점수 계산 로직
            let score = 50;

                            <p class="text-slate-700 text-sm">${pair.dateIdea}</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <p class="text-xs font-bold text-slate-600 mb-2">이 조합에서 특히 하지 말 것</p>
                            <ul class="style-list text-sm text-slate-600">${avoidAll.map(a => `<li>${a}</li>`).join('')}</ul>
                        </div>
                    </div>
                </div>

                <div class="clean-card p-6 md:p-8 bg-white">
                    <h4 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                        <i class="fas fa-user-shield text-red-500"></i> ${valA}가 특히 조심할 점
                    </h4>
                    ${pair.cautions.length > 0
                        ? `<div class="space-y-3 text-sm text-slate-700 leading-relaxed">${pair.cautions.map(c => `<div class="bg-red-50/80 p-3 rounded-lg border border-red-100">${c}</div>`).join('')}</div>`
                        : `<p class="text-sm text-emerald-700 bg-emerald-50 p-4 rounded-xl">축 차이가 크지 않아요. 상대 유형만 의식하면 됩니다.</p>`
                    }
                    <div class="mt-5 pt-5 border-t border-slate-100">
                        <p class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wide">연락 · 통화 가이드</p>
                        <ul class="style-list text-sm text-slate-600">${pair.commGuide.map(l => `<li>${l}</li>`).join('')}</ul>
                    </div>
                    <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="bg-indigo-50 p-4 rounded-xl text-center border border-indigo-100">
                            <p class="text-xs text-slate-500 mb-1">접근 스타일</p>
                            <p class="font-bold text-indigo-700">${pair.approach.role}</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl border border-slate-200 text-xs space-y-1">
                            <p class="text-blue-600 font-bold"><i class="fas fa-check mr-1"></i>${pair.approach.good}</p>
                            <p class="text-rose-500 font-bold"><i class="fas fa-times mr-1"></i>${pair.approach.bad}</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('result-content').innerHTML = resultHTML;
            document.getElementById('input-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            window.scrollTo(0, 0);
            
            setTimeout(() => { 
                const bar = document.querySelector('.score-bar'); 
                if(bar) bar.style.width = score + '%'; 
            }, 300);
            }
            
            if (openCoupang) {
                window.open('https://link.coupang.com/a/ddddJ5', '_blank');
                setTimeout(() => { showAnalysisResult(); }, 100);
            } else {
                showAnalysisResult();
            }
        }

    
        document.addEventListener('DOMContentLoaded', () => {
            initTestGrids('/some');
        });
    </script>
</body>
</html>
