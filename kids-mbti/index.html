    <script>
    const LIKERT = [
      { label: "매우 그렇다", value:  2 },
      { label: "그렇다",     value:  1 },
      { label: "보통이다",   value:  0 },
      { label: "아니다",     value: -1 },
      { label: "매우 아니다", value: -2 }
    ];

    const W_PRIMARY = 2;
    const W_SECONDARY = 1;

    const QUESTIONS = [
      // E/I
      { id: "EI1", axis: "EI", weight: W_PRIMARY, left: "E", right: "I",
        text: "낯선 놀이터/키즈카페에서, 먼저 다가가서 같이 놀자고 하는 편이다.",
        hint: "예: 처음 본 아이에게 장난감을 보여주거나 말을 건다." },
      { id: "EI2", axis: "EI", weight: W_SECONDARY, left: "E", right: "I",
        text: "사람 많은 곳을 다녀온 날은, 집에 와서도 말/행동이 더 활발해지는 편이다.",
        hint: "반대로 조용해지고 혼자 쉬고 싶으면 I 쪽일 수 있어요." },

      // S/N
      { id: "SN1", axis: "SN", weight: W_PRIMARY, left: "S", right: "N",
        text: "장난감은 ‘원래 용도대로’(자동차는 자동차처럼) 반복해서 노는 편이다.",
        hint: "예: 같은 길로 계속 굴리거나, 블록을 같은 방식으로 쌓는다." },
      { id: "SN2", axis: "SN", weight: W_SECONDARY, left: "S", right: "N",
        text: "장난감에 상상 설정(역할/스토리)을 자주 붙여서 노는 편이다.",
        hint: "예: 자동차가 공룡이 되고, 인형이 의사가 된다." },

      // T/F
      { id: "TF1", axis: "TF", weight: W_PRIMARY, left: "T", right: "F",
        text: "다툼이 생기면 ‘누가 먼저/차례/규칙’ 같은 공정함을 먼저 말하는 편이다.",
        hint: "예: “내 차례야!”, “약속했잖아!”" },
      { id: "TF2", axis: "TF", weight: W_SECONDARY, left: "T", right: "F",
        text: "다툼이 생기면 ‘속상해/무서워/서운해’처럼 감정을 먼저 말하는 편이다.",
        hint: "예: “나 기분 나빠…”, “친구가 싫어졌어…”" },

      // J/P
      { id: "JP1", axis: "JP", weight: W_PRIMARY, left: "J", right: "P",
        text: "준비/정리 순서(루틴)가 깨지면 특히 싫어하는 편이다.",
        hint: "예: ‘양치→책→잠’ 순서가 바뀌면 크게 항의한다." },
      { id: "JP2", axis: "JP", weight: W_SECONDARY, left: "J", right: "P",
        text: "놀이나 활동을 하다가 중간에 딴짓으로 새거나 즉흥 변경이 잦은 편이다.",
        hint: "예: 블록하다가 갑자기 그림, 또 갑자기 간식으로 이동." }
    ];

    let selectedGender = "";

    function selectGender(g) {
      selectedGender = g;
      const base = "flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl p-3 text-center font-bold text-slate-600 transition-all hover:bg-indigo-50 hover:border-indigo-300";
      document.getElementById("gender-male").className = base;
      document.getElementById("gender-female").className = base;
      const active = "flex-1 bg-indigo-500 border-2 border-indigo-500 rounded-xl p-3 text-center font-bold text-white transition-all shadow-lg transform scale-105";
      document.getElementById("gender-" + g).className = active;
    }

    function renderQuestions() {
      const root = document.getElementById("questions");
      root.innerHTML = "";

      QUESTIONS.forEach((q, idx) => {
        const name = q.id;
        const options = LIKERT.map((o, i) => {
          const oid = `${q.id}_${i}`;
          return `
            <div class="flex-1 min-w-[86px]">
              <input id="${oid}" type="radio" name="${name}" value="${o.value}" class="sr-only peer" />
              <label for="${oid}" class="block text-center px-3 py-2 rounded-xl text-sm font-bold text-slate-700 chip hover:bg-indigo-50 hover:border-indigo-200 cursor-pointer transition peer-checked:chip-checked peer-checked:ring-2 peer-checked:ring-indigo-200">
                ${o.label}
              </label>
            </div>
          `;
        }).join("");

        root.insertAdjacentHTML("beforeend", `
          <div class="p-4 rounded-2xl border border-slate-200 bg-white">
            <div class="text-xs font-black text-slate-500 mb-1">질문 ${idx + 1}</div>
            <div class="text-base font-extrabold text-slate-800 leading-snug">${q.text}</div>
            <div class="text-xs text-slate-500 mt-1">${q.hint}</div>
            <div class="flex flex-wrap gap-2 mt-3">
              ${options}
            </div>
          </div>
        `);
      });
    }

    function getAnswerValue(qid) {
      const checked = document.querySelector(`input[name="${qid}"]:checked`);
      if (!checked) return null;
      return Number(checked.value);
    }

    function decideAxis(axis, q1, q2, leftLetter, rightLetter) {
      const score = (q1 * W_PRIMARY) + (q2 * W_SECONDARY);

      let letter = "X";
      if (score > 0) letter = leftLetter;
      else if (score < 0) letter = rightLetter;
      else {
        if (q1 > 0) letter = leftLetter;
        else if (q1 < 0) letter = rightLetter;
        else letter = "X";
      }

      const confidence = Math.min(6, Math.abs(score));
      return { axis, score, confidence, letter, leftLetter, rightLetter };
    }

    function axisInfo(letter, leftLetter, rightLetter) {
      const map = {
        "E": { title: "활발한 편", desc: "사람/활동이 에너지원", icon: "fa-face-grin-stars", color: "text-pink-600", bg: "bg-pink-50 border-pink-100" },
        "I": { title: "조용한 편", desc: "혼자 시간이 회복", icon: "fa-moon", color: "text-indigo-600", bg: "bg-indigo-50 border-indigo-100" },
        "S": { title: "현실파", desc: "구체/반복이 편해요", icon: "fa-cube", color: "text-emerald-700", bg: "bg-emerald-50 border-emerald-100" },
        "N": { title: "상상파", desc: "이야기/역할놀이 좋아요", icon: "fa-wand-magic-sparkles", color: "text-fuchsia-700", bg: "bg-fuchsia-50 border-fuchsia-100" },
        "T": { title: "규칙 먼저", desc: "차례/공정이 중요", icon: "fa-scale-balanced", color: "text-slate-700", bg: "bg-slate-50 border-slate-200" },
        "F": { title: "마음 먼저", desc: "감정/관계가 중요", icon: "fa-heart", color: "text-rose-700", bg: "bg-rose-50 border-rose-100" },
        "J": { title: "루틴 좋아", desc: "예고/순서가 편해요", icon: "fa-list-check", color: "text-sky-700", bg: "bg-sky-50 border-sky-100" },
        "P": { title: "즉흥 좋아", desc: "탐색/변화가 즐거워요", icon: "fa-dice", color: "text-amber-700", bg: "bg-amber-50 border-amber-100" }
      };
      if (letter !== "X" && map[letter]) return map[letter];
      return {
        title: `${leftLetter}/${rightLetter} 반반`,
        desc: "상황에 따라 달라요",
        icon: "fa-shuffle",
        color: "text-slate-700",
        bg: "bg-slate-50 border-slate-200"
      };
    }

    function oneTip(letter) {
      const tips = {
        "E": "흥분이 올라가면: 몸놀이→물 한 모금→짧은 정리(1분)로 내려오기",
        "I": "사람 많은 자리 후엔: 조용 코너(담요/책) 5분 먼저 주기",
        "S": "지시는 짧게: “먼저 신발→그다음 모자”처럼 한 단계씩",
        "N": "상상 놀이 존중: 아이 설정을 한 번 따라주면 협조가 빨라져요",
        "T": "차례 싸움: 타이머/스티커로 ‘공정’을 눈에 보이게",
        "F": "먼저 공감 한 문장: “속상했구나”가 진정에 도움",
        "J": "변경이 있으면 예고: “5분 뒤 정리→간식”처럼 미리 알려주기",
        "P": "전환은 게임처럼: “3개만 줍기” 미션으로 정리 시작"
      };
      return tips[letter] || "컨디션/환경에 따라 달라질 수 있어요. 요즘 가장 자주 보이는 모습으로 봐주세요.";
    }

    function buildResultHTML(genderLabel, axisResults) {
      const typeParts = axisResults.map(r => r.letter === "X" ? `${r.leftLetter}/${r.rightLetter}` : r.letter);
      const compact = typeParts.every(p => p.length === 1) ? typeParts.join("") : typeParts.join(" · ");

      const cards = axisResults.map(r => {
        const info = axisInfo(r.letter, r.leftLetter, r.rightLetter);
        const chosen = r.letter === "X" ? `${r.leftLetter}/${r.rightLetter}` : r.letter;
        return `
          <div class="p-4 rounded-2xl border ${info.bg}">
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 rounded-xl bg-white/70 border border-white flex items-center justify-center">
                <i class="fas ${info.icon} ${info.color}"></i>
              </div>
              <div class="flex-1">
                <div class="text-xs font-black ${info.color}">${chosen}</div>
                <div class="text-base font-extrabold text-slate-800">${info.title}</div>
                <div class="text-xs text-slate-600 mt-1">${info.desc}</div>
                <div class="text-xs text-slate-600 mt-2 bg-white/60 rounded-xl p-2 border border-white">
                  💡 ${oneTip(r.letter === "X" ? "X" : r.letter)}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="clean-card p-6 md:p-8 bg-white text-center">
          <span class="inline-block bg-indigo-50 text-indigo-600 text-xs font-black px-3 py-1 rounded-full mb-3">FOR FUN · UNDER 5</span>
          <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-2">
            이번 결과: <span class="text-point">${compact}</span>
          </h2>
          <p class="text-slate-500 text-sm">${genderLabel ? `${genderLabel} · ` : ""}진단이 아니라 “참고용”이에요. (잘 크면 또 바뀜)</p>
        </div>

        <div class="clean-card p-6 md:p-8 bg-white">
          <h3 class="text-lg font-extrabold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fas fa-baby text-indigo-600"></i> 한눈에 보기
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${cards}
          </div>
          <p class="mt-4 text-xs text-slate-400">팁은 “지금 이 시기”에 도움이 될 만한 힌트만 담았어요.</p>
        </div>
      `;
    }

    function runTest(openCoupang = false) {
      const answers = {};
      for (const q of QUESTIONS) {
        const v = getAnswerValue(q.id);
        if (v === null) {
          alert("모든 문항에 답해주세요!");
          return;
        }
        answers[q.id] = v;
      }

      function displayResult() {
        const EI = decideAxis("EI", answers["EI1"], answers["EI2"], "E", "I");
        // SN2 / TF2 / JP2는 반대 성향 문장이라 역채점으로 통일
        const SN = decideAxis("SN", answers["SN1"], -answers["SN2"], "S", "N");
        const TF = decideAxis("TF", answers["TF1"], -answers["TF2"], "T", "F");
        const JP = decideAxis("JP", answers["JP1"], -answers["JP2"], "J", "P");

        const axisResults = [EI, SN, TF, JP];

        const genderLabel = selectedGender === "male" ? "남아" : selectedGender === "female" ? "여아" : "";

        document.getElementById("result-content").innerHTML = buildResultHTML(genderLabel, axisResults);
        document.getElementById("input-page").classList.add("hidden");
        document.getElementById("result-page").classList.remove("hidden");
        window.scrollTo(0, 0);
      }

      if (openCoupang) {
        window.open("https://link.coupang.com/a/ddddJ5", "_blank");
        setTimeout(() => displayResult(), 100);
      } else {
        displayResult();
      }
    }

    function resetPage() {
      document.getElementById("result-page").classList.add("hidden");
      document.getElementById("input-page").classList.remove("hidden");

      document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      selectedGender = "";

      const base = "flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl p-3 text-center font-bold text-slate-600 transition-all hover:bg-indigo-50 hover:border-indigo-300";
      document.getElementById("gender-male").className = base;
      document.getElementById("gender-female").className = base;

      window.scrollTo(0, 0);
    }

    function shareLink() {
      const currentUrl = window.location.href;
      const title = "우리 아이 성향 테스트(만 5세 미만) · 8문항(재미로)";
      const text = "보호자 관찰 8문항으로 우리 아이 성향을 재미로 확인해보기 👶";
      if (navigator.share) {
        navigator.share({ title, text, url: currentUrl });
      } else {
        const t = document.createElement("textarea");
        document.body.appendChild(t);
        t.value = currentUrl;
        t.select();
        document.execCommand("copy");
        document.body.removeChild(t);
        alert("링크 복사 완료!");
      }
    }

    renderQuestions();
  </script>
</body>
</html>
